# ACP — full local / customer-VPC stack.
#
#   cd deploy/compose
#   cp .env.example .env        # then edit secrets
#   docker compose up --build
#
# Brings up four services, no external dependencies (no Azure, no MDK):
#   db        Postgres 16   — acpdb (app) + langfusedb (tracing), one instance
#   ollama    local models  — the AI lane (http://localhost:11434), models on a VOLUME
#   acp-app   FastAPI + SPA — the platform itself (http://localhost:8077)
#   grafana   dashboards    — 10-panel ACP board (http://localhost:3000, anon viewer)
#   langfuse  LLM tracing   — per-scan / per-rule traces (http://localhost:3001)
#
# See README.md in this folder for the two build prerequisites (the .NET Office
# CLI and the vendored Python PDF engine) the acp-app image needs.
#
# Plus one service that is NOT in that stack and does not start with `docker compose up`:
#   test      backend suite — the CI toolchain, on your working tree. `--profile test`.
# See "Running the backend suite" in README.md.

name: acp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acpadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acp_local_dev}
      POSTGRES_DB: acpdb
    volumes:
      - acp-db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acpadmin} -d acpdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  acp-app:
    build:
      context: ../..                       # repo root — Dockerfile bundles both engines
      dockerfile: deploy/public/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8077
      # In-process worker pool. Azure splits the tiers (#113) and runs this at 0 on the API
      # container, but a single-node stack has no worker container to drain the jobs table —
      # left at the code default of 0 the app boots healthy, serves the SPA, and every scan
      # sits in the queue forever (/readyz: worker_tier_never_started).
      # 8 workers: enough to assess 8 documents in parallel on a 4-core host (each worker
      # is I/O-bound on the vision HTTP call, not CPU-bound). Override with ACP_WORKERS.
      ACP_WORKERS: ${ACP_WORKERS:-8}
      # App data → acpdb. No GIS/ADC locally → runs in demo mode (scans bundled corpus).
      DATABASE_URL: postgresql://${POSTGRES_USER:-acpadmin}:${POSTGRES_PASSWORD:-acp_local_dev}@db:5432/acpdb?sslmode=disable
      # Tracing → the langfuse service. Keys come from .env (see README to mint them).
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Optional: set to enable per-user Google sign-in. Unset → demo/local mode.
      ACP_GOOGLE_CLIENT_ID: ${ACP_GOOGLE_CLIENT_ID:-}
      ACP_E2E_KEY: ${ACP_E2E_KEY:-}
      # The AI lane. api/ai.py degrades to deterministic prose when this is unreachable, so a
      # stack without the ollama service still works — it just stops drafting.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      # qwen2.5vl:7b LOCALLY, not moondream. moondream is the CLOUD default and stays one —
      # deploy/ollama/Dockerfile records the 8Gi Azure Consumption ceiling that forced it, and
      # ADR 0022 requires the CPU floor to remain always-available, so the deployed default is
      # not this file's to change.
      #
      # Locally that ceiling does not exist, and the difference is measurable rather than
      # theoretical. On 2026-08-08, against test-corpus's own enrollment-notice fixture:
      # moondream returned an EMPTY response twice, then a hallucinated URL fragment its own
      # alt-text guard rejected; qwen2.5vl:7b returned clean, accurate alt on every call. On a
      # generated .docx, remediation applied 9 fixes with 1.1.1 among them.
      #
      # Neither model is pre-pulled — this stack keeps models on a volume (see the ollama
      # service below), so the first run pulls whichever is named here either way. Pointing at
      # the one that works costs nothing extra.
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
    ports:
      - "${ACP_APP_PORT:-8077}:8077"

  # Models live on a NAMED VOLUME here, not baked into the image — the opposite of
  # deploy/ollama/Dockerfile, and deliberately.
  #
  # That image bakes llama3.1:8b + moondream so a cloud container has no multi-GB cold start,
  # and its own comment records why those two: llava:7b + llama came to ~9.2GB and OOM-killed
  # the container against an 8Gi Azure Consumption ceiling. Those are DEPLOYMENT constraints.
  #
  # Locally the constraint is the opposite one. Trying a different model should not mean
  # rebuilding an image, and a workstation with real memory is not choosing models to fit 8Gi.
  # A volume makes `ollama pull qwen3:14b` a one-liner that survives restarts, which is the
  # whole point of scripts/bench_models.py.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # 2 so a text and a vision model stay resident together — swapping between them per call
      # is what made the cloud image slow before the models were made to fit side by side.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - acp-ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      # `ollama list` and NOT curl: the ollama/ollama image ships no curl, so the original check
      # failed with "/bin/sh: 1: curl: not found" on every probe and the container sat permanently
      # unhealthy while working perfectly. Observed live, 10s apart, for the whole of a 7-minute
      # model pull that was succeeding the entire time.
      #
      # The property that mattered is unchanged and is why this is not just "use the CLI": the
      # check must pass on an EMPTY volume, because that is what a fresh clone has. `ollama list`
      # returns its header row and exits 0 with no models pulled, so a healthy server reads
      # healthy before anything is downloaded — a check gated on a model would report unhealthy
      # in exactly the state this stack starts in.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    build:
      context: ../grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ACP_GRAFANA_PG_HOST: db:5432
      ACP_GRAFANA_PG_DB: acpdb
      ACP_GRAFANA_PG_USER: ${POSTGRES_USER:-acpadmin}
      ACP_GRAFANA_PG_PASS: ${POSTGRES_PASSWORD:-acp_local_dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  langfuse:
    image: langfuse/langfuse:2          # v2 — single Postgres dependency (v3 adds CH/redis/minio)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acpadmin}:${POSTGRES_PASSWORD:-acp_local_dev}@db:5432/langfusedb
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme_generate_a_long_random_string}
      SALT: ${LANGFUSE_SALT:-changeme_generate_another_random_string}
      TELEMETRY_ENABLED: "false"
      # Open registration so the team can self-serve accounts (matches the cloud deploy).
      AUTH_DISABLE_SIGNUP: "false"
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"

  # NOT part of the stack above either, and for the same reason the azp-agent below is here:
  # one compose file per machine beats two. `--profile test` keeps it out of
  # `docker compose up`, so a developer bringing up the platform never starts a test runner.
  #
  # WHAT IT IS FOR. `python -m pytest tests/` on a host missing the toolchain exits 1 with
  # dozens of failures across ~8 modules, every one of them an absent dependency (dotnet,
  # pdfplumber, langfuse, tesseract) rather than repo breakage. That has cost real time
  # repeatedly — on 2026-08-19 a session reported "32 pre-existing test failures" and carried
  # the claim through four PRs before it turned out to be its own venv. This service is the
  # answer to "is it me or is it the repo", and deploy/test/Dockerfile records what CI installs
  # and why.
  #
  # NOT A RUNTIME IMAGE. acp-app above builds deploy/public/Dockerfile, which ships compiled
  # engines, a built SPA and no test dependencies. This builds deploy/test/Dockerfile, which
  # ships the .NET SDK and tests/requirements.txt and no application code at all.
  test:
    profiles: ["test"]
    build:
      context: ../..                       # repo root — the Dockerfile reads requirements + csprojs
      dockerfile: deploy/test/Dockerfile
    depends_on:
      # Postgres is up and healthy before the suite starts. Note what this does NOT mean — see
      # the DATABASE_URL comment below, which is the reason this service does not simply hand
      # the suite a connection string.
      db:
        condition: service_healthy
    environment:
      # DATABASE_URL IS DELIBERATELY NOT SET, and this is the one line in this service worth
      # reading twice. api/store.py line 753 picks its adapter from it —
      # `_PgAdapter(_DATABASE_URL) if _DATABASE_URL else _SQLiteAdapter(...)` — so exporting it
      # does not "let tests that want Postgres find it", it moves the WHOLE suite onto Postgres.
      #
      # Measured, because this service originally did set it: with DATABASE_URL pointed at the
      # db service the run was 240 failed, 3180 passed, 38 skipped, 5 errors; without it,
      # 3425 passed, 38 skipped, 0 failed. Isolated to one module with no other load, both ways:
      # tests/test_remediated_download_isolation.py is 5 passed / exit 0 unset, and
      # 1 passed + 4 errors / exit 1 set — `psycopg2.errors.UniqueViolation: duplicate key value
      # violates unique constraint "scan_runs_pkey"`. The suite's fixtures assume a private
      # database per test (tests/conftest.py hands every Store a fresh temp SQLite file); a
      # single shared Postgres collides on primary keys.
      #
      # CI has no Postgres at all, so NOT setting it is also what makes this agree with the gate.
      # `db` is still a dependency below and is reachable at db:5432 for anything that wants it.
      #
      # No secrets here, and nothing that changes what the suite asserts. OLLAMA_BASE_URL is
      # likewise absent on purpose: the Ollama-backed tests self-skip when no model answers,
      # which is what ci.yml does too ("Ollama-backed tests self-skip here … so no model is
      # needed and none is installed"). Wiring the ollama service in would make this run diverge
      # from the gate, not converge on it.
      ACP_TEST_DB_HOST: db:5432          # informational: where Postgres is, for a test that opts in
    volumes:
      # THE REPO ITSELF, read-write. This is the whole design: the image carries the toolchain,
      # the mount carries the code, so the suite runs against the working tree — uncommitted
      # edits included — and a source change needs no rebuild.
      #
      # Read-write is required, not convenience. pytest writes __pycache__; the entrypoint
      # compiles the Office CLI into the gitignored spike/dotnet/**/bin/; and
      # tests/test_scope_presets_frontend_sync.py deliberately corrupts a generated file and
      # restores it in a finally, because a --check that cannot fail is indistinguishable from
      # one that passed.
      #
      # It also means `.git` is visible, which five test modules and two of the four checks
      # need. Those checks read HISTORY: run them against a `--depth 1` clone and
      # gen_progress_log.py finds no commits to inspect and passes VACUOUSLY (ci.yml sets
      # fetch-depth: 0 for exactly this). Measured here: on a shallow clone,
      # test_generation_succeeds_over_this_repos_real_history fails with "the generator produced
      # an empty log over real history"; after `git fetch --unshallow`, it passes.
      - ../..:/app
      # NuGet + pip caches survive `docker compose down`, so a rebuilt image does not re-pull.
      - acp-test-nuget:/root/.nuget/packages
    working_dir: /app
    # No `ports`, no `restart`. It is a one-shot command runner, not a service: it must exit
    # with the suite's status and stay exited.
    init: true

  # NOT part of the stack above, and started separately — `docker compose --profile ci up -d`.
  # It shares nothing with the app services; it is only here so there is one compose file per
  # machine rather than two. See ../agent/README.md for what to do on the Azure DevOps side
  # first (the pool, and the token, which is yours to mint and paste — it never belongs in a
  # committed file).
  #
  # WHY: MovateAI-Foundry has ONE hosted parallel job across all its pipelines, so acp's PRs
  # queue behind every other project's builds. A self-hosted agent is a free second lane with
  # unlimited minutes, and after the first run its caches are warm — which a hosted agent's
  # fresh VM can never be.
  azp-agent:
    profiles: ["ci"]
    build:
      context: ../agent
    restart: unless-stopped
    environment:
      AZP_URL: ${AZP_URL:?set AZP_URL in .env, e.g. https://dev.azure.com/MovateAI-Foundry}
      AZP_TOKEN: ${AZP_TOKEN:?set AZP_TOKEN in .env — a PAT with Agent Pools (read, manage)}
      AZP_POOL: ${AZP_POOL:-acp-local}
      AZP_AGENT_NAME: ${AZP_AGENT_NAME:-m5-local}
    volumes:
      # The whole speed argument lives on this line. start.sh runs the agent with --once so the
      # PROCESS is disposable, but _work/ holds the git checkout and the tool cache (.NET SDK,
      # Node, npm and pip downloads). Persist it and the second run skips what the first paid
      # for; drop it and this is just a hosted agent that happens to be in the room.
      - acp-azp-work:/azp/_work
    # No `ports` and no docker socket — nothing needs to reach in, and the pipeline builds no
    # images locally (`az acr build` runs server-side). Mounting the socket here would hand
    # any pipeline edit root on the host, for no capability this repo actually uses.

volumes:
  acp-ollama:
  acp-db:
  acp-azp-work:
  acp-test-nuget:
