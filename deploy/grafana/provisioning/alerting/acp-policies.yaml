apiVersion: 1

# Route all ACP alerts to the webhook contact point. This sets the root
# notification policy, so the "Compliance score below 80" and "Stuck items"
# rules now deliver instead of firing into the void.
policies:
  - orgId: 1
    receiver: acp-webhook
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
