apiVersion: 1

# Provisioned alert rules for ACP. They evaluate against the acp_pg datasource and
# show firing/normal state in Grafana's Alerting UI. Notification delivery uses the
# org's default notification policy / contact point — configure email or Slack in
# Settings → Contact points to actually receive them.
groups:
  - orgId: 1
    name: ACP compliance
    folder: ACP Alerts
    interval: 5m
    rules:
      # ── Average compliance score dropped below 80 on the latest scan ──
      - uid: acp-low-avg-score
        title: Compliance score below 80
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: The latest scan's average accessibility score is below 80.
        labels:
          severity: warning
          area: accessibility
        data:
          - refId: A
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: acp_pg
            model:
              refId: A
              datasource: { type: postgres, uid: acp_pg }
              rawSql: "SELECT avg_score AS value FROM scan_runs WHERE completed_at IS NOT NULL ORDER BY completed_at DESC LIMIT 1"
              format: table
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [80] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query

      # ── One or more async jobs exhausted retries (dead-letter / "stuck items") ──
      - uid: acp-stuck-items
        title: Stuck items in the queue
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: One or more background jobs exhausted retries and need attention.
        labels:
          severity: critical
          area: queue
        data:
          - refId: A
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: acp_pg
            model:
              refId: A
              datasource: { type: postgres, uid: acp_pg }
              rawSql: "SELECT COUNT(*) AS value FROM jobs WHERE status='dead'"
              format: table
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last }
                  type: query
