apiVersion: 1

datasources:
  - name: ACP-Postgres
    uid: acp_pg
    type: postgres
    access: proxy
    # Connection from env vars set by deploy.sh (parsed from DATABASE_URL).
    # NOTE: Grafana only supports $VAR / ${VAR} substitution — NOT bash-style
    # ${VAR:default}, which leaves the field empty. Keep these plain.
    url: ${ACP_GRAFANA_PG_HOST}
    database: ${ACP_GRAFANA_PG_DB}
    user: ${ACP_GRAFANA_PG_USER}
    secureJsonData:
      password: ${ACP_GRAFANA_PG_PASS}
    jsonData:
      sslmode: require
      postgresVersion: 1400
      timescaledb: false
    isDefault: true
    editable: false
