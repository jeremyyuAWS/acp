# ACP Lite — static single-page server.
#
# Azure Container Apps terminates TLS at its ingress and forwards plain HTTP, so nothing here
# does TLS. Everything below is either "serve one file" or a header that costs nothing and
# closes something off.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page holds no real estate data, but it is a prototype of a tool that inspects a
    # hospital's documents and it should not turn up in a search index next to the real product.
    # The <meta name="robots"> in the page says the same thing; this covers the fetchers that
    # read the header and never parse the body.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The app is ONE file: inline CSS, inline JS, the logo as a data URI, and no external
    # reference of any kind — verified by grepping the built page for `https://`. The policy is
    # written to match that exactly, so a later edit that pastes in a CDN script or a webfont
    # fails visibly in the browser here rather than shipping and quietly adding a dependency.
    # `connect-src 'none'` is the load-bearing one: this build talks to no backend, and if that
    # ever changes it should be a deliberate edit to this line.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # A prototype is edited far more often than it is cached. no-store rather than a short
    # max-age because the failure it prevents — someone reviewing yesterday's build and
    # reporting a bug that is already fixed — costs more than the bandwidth does.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # Container Apps' health probes need an endpoint that does not depend on the page. Serving
    # the page itself as the probe target would tie liveness to a 60 KB read.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # There is exactly one page. Anything else is a mistake or a scan; send it to the page
    # rather than to nginx's default 404 body, which advertises the server version.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    server_tokens off;
}
