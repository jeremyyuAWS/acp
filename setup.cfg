# mutmut runs pytest inside a `mutants/` copy of the tree, so anything the suite reaches for has
# to be copied too. Each of these was added because its absence broke a real run: api/ (the
# target's bare sibling imports), config/ (store.py reads config/rule-catalog.json at import),
# scripts/ (test_docx_metamorphic imports corpus_expectations), test-corpus/ (the oracle
# fixtures), engine/ (the vendored PDF analyser, ADR 0029 — test_certification_needs_a_detector
# asserts it actually runs), rules/, and the alias plugin itself.
#
# Discovered one at a time, each by a run that failed loudly. That is the good failure mode: a
# missing directory errors during stats collection, so mutmut refuses to score rather than
# reporting a campaign over the tests that happened to survive collection.
also_copy =
    api
    config
    engine
    rules
    scripts
    test-corpus
    mutmut_module_alias.py

# Reconciles mutmut's `api.office_structure` mutant keys with this repo's bare `office_structure`
# imports. Without it mutmut stops with "no mutant key matched" and reports nothing.
pytest_add_cli_args = -p mutmut_module_alias
