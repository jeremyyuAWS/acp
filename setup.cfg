[mutmut]
# P5.4 — mutation testing, ON DEMAND ONLY (scripts/mutation_test.py). Nothing in CI reads this;
# tests/test_mutation_harness.py guards that, and guards the three ways this config can silently
# measure less than it claims.

# The module under test. Every entry here must also appear in mutmut_module_alias.TARGETS, or
# mutmut cannot match its mutants to the tests that ran and quietly leaves it out of the score.
source_paths = api/office_structure.py

# The tests are what grade the mutants, so the selection is EVERY test module that imports the
# target — 58 of them, found with `grep -lE "import office_structure" tests/*.py`. A narrower,
# docx-only selection was tried first and scored 32.1%; most of those survivors were in the shared
# `office_*` helpers that pptx and xlsx own, reached by the docx tests without being asserted by
# them. That number measured the SELECTION, not the suite.
pytest_add_cli_args_test_selection =
    tests/test_apply_field_name.py
    tests/test_assess_gaps_pdf_html.py
    tests/test_certification_needs_a_detector.py
    tests/test_contrast_remediation.py
    tests/test_docx_412_auto_lane.py
    tests/test_docx_color_and_nontext_contrast_lanes.py
    tests/test_docx_color_only_link_parts.py
    tests/test_docx_empty_heading.py
    tests/test_docx_form_controls_header_parity.py
    tests/test_docx_header_footer_parity.py
    tests/test_docx_libreoffice_roundtrip.py
    tests/test_docx_nontext_contrast_parts.py
    tests/test_docx_producer_dialects.py
    tests/test_evidence_fields.py
