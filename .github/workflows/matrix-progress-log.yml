# Tell the WCAG matrix that something landed here. Two independent signals:
#
#   acp-progress-log      — a pushed commit opted into the public changelog with a
#                           `Matrix-Note:` trailer (see scripts/gen_progress_log.py). The matrix
#                           splices it into its PROGRESS_LOG. Opt-in and curated.
#   acp-capability-change — a pushed commit touched a file the matrix's per-cell capability
#                           CEILING is computed from (scripts/gen_matrix_coverage.py --sources).
#                           The matrix re-derives the ceiling and opens a PR for any grid cell
#                           now claiming more than this code supports. NOT opt-in: a ceiling can
#                           move without anyone writing a trailer, and an over-claiming cell is
#                           a correctness bug rather than a changelog omission.
#
# The two overlap often and that is fine — both are idempotent on the far side.
#
# On a push to main, fire a repository_dispatch at jeremyyuAWS/wcag-matrix, whose own workflows
# clone this repo, run ITS generators, and update index.html.
#
# The dispatch carries NO entry data on purpose. It is a bare "something landed, go
# look" signal:
#   * no 64KB client_payload ceiling to design around;
#   * the generator lives in exactly one place (here) rather than being duplicated or
#     vendored into the matrix repo;
#   * the matrix regenerates from full history and de-duplicates by commit hash, so a
#     dropped or missed dispatch is self-healing — the next one catches up, and a
#     manual workflow_dispatch over there re-syncs from scratch.
#
# This repo's primary CI is Azure Pipelines (azure-pipelines.yml); this workflow is
# notification only and deliberately runs no tests.
#
# SETUP — one secret is required:
#   MATRIX_DISPATCH_TOKEN: a PAT with write access to jeremyyuAWS/wcag-matrix.
#   The default GITHUB_TOKEN cannot dispatch to a different repository.
#   Fine-grained PAT: repository = jeremyyuAWS/wcag-matrix, Contents = read & write.
#   Add via: gh secret set MATRIX_DISPATCH_TOKEN --repo jeremyyuAWS/acp
# Without a USABLE secret this job logs a notice/warning and exits 0 — it never fails a push.
# That covers both an absent secret and one the far repo rejects (expired, revoked, wrong
# scope): the dispatch is best-effort by design, so a credential problem is reported, not fatal.

name: Notify WCAG matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gen_progress_log.py reads commit bodies across the range

      - name: Find publishable commits in this push
        id: scan
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          # First push to a branch, a force-push, or a manual run: `before` is absent or
          # the all-zero sha and is not a usable range endpoint. Fall back to the single
          # head commit — the matrix de-duplicates, so a narrow range is always safe.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            range_args="--since HEAD~1"
          else
            range_args="--since $before"
          fi
          echo "scanning $range_args"
          python3 scripts/gen_progress_log.py $range_args > /tmp/entries.json
          count=$(python3 -c "import json;print(len(json.load(open('/tmp/entries.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count publishable commit(s) in this push"

          # Did this push touch anything a capability ceiling is computed from? The path list
          # lives in the generator, next to the loaders that read those files, so it cannot
          # drift from what actually feeds a ceiling.
          from_ref="${range_args#--since }"
          changed=$(git diff --name-only "$from_ref" HEAD)
          touched=no
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            # A trailing slash means "this whole subtree" — api/formats/ holds one package per
            # format, so a new detector is a new FILE and an exact-match test would never see it.
            if [ "${src%/}" != "$src" ]; then
              if grep -q "^${src}" <<<"$changed"; then touched=yes; break; fi
            elif grep -qxF "$src" <<<"$changed"; then
              touched=yes; break
            fi
          done < <(python3 scripts/gen_matrix_coverage.py --sources)
          echo "capability=$touched" >> "$GITHUB_OUTPUT"
          echo "capability sources touched: $touched"

      - name: Dispatch to wcag-matrix
        if: steps.scan.outputs.count != '0' || steps.scan.outputs.capability == 'yes'
        env:
          GH_TOKEN: ${{ secrets.MATRIX_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::MATRIX_DISPATCH_TOKEN is not set — skipping. See the setup" \
                 "note in .github/workflows/matrix-progress-log.yml."
            exit 0
          fi
          # A token that EXISTS but cannot be used — expired, revoked, or scoped to the wrong
          # repo — used to fail the push, which this workflow promises never to do. The guard
          # above only ever caught an ABSENT secret, so from 2026-07-29 every push to main went
          # red on `gh: Bad credentials (HTTP 401)` while the notification it protects is, by
          # design, best-effort: the matrix regenerates from full history and de-duplicates by
          # commit hash, so a skipped dispatch costs a delay and nothing else.
          #
          # Environmental failures (the token can't do this / GitHub is down) are therefore
          # treated exactly as an absent secret is: say so loudly, exit 0. Anything else still
          # fails, because a 4xx that is NOT about credentials means this workflow is asking for
          # something wrong — a bad event_type, a malformed payload — and that is a defect here
          # rather than a condition of the environment. Silence on that would leave the matrix
          # quietly un-notified forever, which is the failure mode this file exists to avoid.
          dispatch() {
            local out status code
            out=$(gh api repos/jeremyyuAWS/wcag-matrix/dispatches \
                    -f event_type="$1" -F "client_payload[sha]=${{ github.sha }}" 2>&1) \
              && status=0 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "dispatched $1 for ${GITHUB_SHA:0:7}"
              return 0
            fi
            # `|| code=` matters: with `set -o pipefail` a no-match grep would otherwise abort
            # the function here, failing the push with no message at all — the mystery failure
            # this whole block exists to replace. No status code just means "unclassified".
            code=$(grep -oE 'HTTP [0-9]{3}' <<<"$out" | tail -1 | tr -cd '0-9') || code=
            case "$code" in
              401|403|404)
                echo "::warning::MATRIX_DISPATCH_TOKEN cannot dispatch to jeremyyuAWS/wcag-matrix" \
                     "(HTTP $code) — $1 skipped for ${GITHUB_SHA:0:7}. Rotate the secret: it needs" \
                     "a PAT with Contents: read & write on that repo. See this file's setup note."
                return 0 ;;
              5??)
                echo "::warning::GitHub returned HTTP $code dispatching $1 — skipped for" \
                     "${GITHUB_SHA:0:7}. The next push re-syncs the matrix."
                return 0 ;;
            esac
            echo "::error::dispatch $1 failed${code:+ with HTTP $code} — not a credential or" \
                 "availability problem, so it is not skipped."
            echo "$out"
            return 1
          }
          if [ "${{ steps.scan.outputs.count }}" != "0" ]; then
            dispatch acp-progress-log
          fi
          if [ "${{ steps.scan.outputs.capability }}" = "yes" ]; then
            dispatch acp-capability-change
          fi
