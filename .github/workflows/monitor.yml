# Is production actually alright?
#
# CI answers "is the code right". Nothing answered "is PRODUCTION right", and on 2026-07-29 that
# cost hours: a scheduled sweep quietly replaced a 258-document estate with a 1-file scan of the
# bundled samples every five minutes, the review inbox could only grow, Drive threw 403 into a log
# nobody read, and production sat four hours behind main with six merged fixes unshipped. Every one
# of those was visible in an API response the whole time. Nothing was looking.
#
# The logic lives in scripts/monitor.py so it can be run by hand against any environment, and so
# the checks that matter are unit-tested (tests/test_monitor.py replays the sweep collapse as data
# and asserts the check goes red). A monitor nobody can test is a monitor nobody should trust.
name: monitor

on:
  schedule:
    # Every 30 minutes — which is what the */15 above it was actually delivering.
    #
    # THE CRON WAS NOT DOING WHAT IT SAID. GitHub does not guarantee scheduled runs; it delays
    # or drops them under load, and on this repo it dropped roughly half. Measured over the last
    # 100 scheduled runs: median gap 27.7 min, mean 30.5, only 23 of them landing in the 13-18
    # minute band the config implied, and 20 gaps over 45 minutes. So the reasoning that used to
    # sit here — "frequent enough that a five-minute-interval bug is caught within a few cycles"
    # — was arithmetic about a cadence that was not happening. A 5-minute bug was getting ~6
    # cycles, not 3.
    #
    # Stating 30 makes the file describe reality, which matters more here than the minutes saved:
    # the next person to reason about detection latency should reason from the real number.
    #
    # WHAT THIS COSTS. Worst-case detection of the 2026-07-29 failure mode (a sweep quietly
    # replacing a 258-document estate every five minutes) moves from ~28 to ~30 minutes at the
    # median. That is not a meaningful change, because the 15 was already fiction.
    #
    # WHAT IT SAVES, honestly: ~16 runs/day at 1 billed minute each (the job itself takes 8
    # seconds; GitHub rounds every job up to a minute), so ~480 min/month, about $4. This is a
    # rounding error against CI, which bills 6 minutes per run across three jobs. It is worth
    # doing because it is free and the config was wrong, not because it fixes the bill.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Read-only. This job observes production; it must never be able to change it.
permissions:
  contents: read

concurrency:
  # A slow or hanging probe must not stack up behind itself. Cancelling here is safe precisely
  # because this job changes nothing — the opposite of the deploy workflow's setting, and for the
  # opposite reason.
  group: monitor-production
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the deploy-drift check counts commits on main since the build

      - name: Probe production
        env:
          ACP_FQDN: ${{ vars.ACP_FQDN }}
          # Unlocks /monitor/estate, and nothing else. This deliberately is NOT ACP_E2E_KEY: that
          # is a whole-gate bypass which the app disables in production by design, so the deep
          # checks could never have run against the deployment that matters. See the header of
          # scripts/monitor.py. Without this key the deep checks — the ones that would have caught
          # the sweep — skip LOUDLY and are counted as skipped, never folded into a green result.
          ACP_MONITOR_KEY: ${{ secrets.ACP_MONITOR_KEY }}
        run: python3 scripts/monitor.py --repo .
