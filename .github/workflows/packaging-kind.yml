# The packaging reference cluster: install the chart on a throwaway Kubernetes and see it run.
#
# WHY THIS EXISTS AS A JOB AND NOT AS MORE TESTS. tests/test_packaging_chart.py renders the chart
# and asserts on the manifests, which is the right way to check what a template produces — and it
# compares the chart against itself, so a chart that renders the wrong thing consistently passes.
# Two defects found on 2026-09-08 were both green under tests that named them: worker Deployments
# inherited the image's CMD and ran the API server, and the API readiness probe pointed at a route
# that never sets a status code and therefore could never fail. Neither was reachable by rendering.
# Both would have died at the first `helm install`.
#
# So this job installs. It builds the application image from this checkout, loads it into a kind
# cluster WITHOUT a registry, supplies the data services the chart deliberately does not own, and
# then asks the running installation the questions `acpctl` was written to ask.
#
# NOT ON EVERY PUSH. It builds a LibreOffice-and-.NET image, so it runs on packaging changes, on
# the Dockerfile that produces the image, and on demand. Everything else keeps using the render
# tests, which are seconds rather than minutes.
name: packaging reference cluster

on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/install_kind.sh'
      - 'scripts/install_helm.sh'
      - '.github/workflows/packaging-kind.yml'
      - 'deploy/public/Dockerfile'
      - 'deploy/public/worker-entry.sh'
  workflow_dispatch:

concurrency:
  group: packaging-kind-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install the chart on a disposable cluster
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The document under test, the namespace it installs into (acpctl defaults the namespace to
      # metadata.name, and this keeps the two from drifting), and the local image tag. The tag is
      # not a version: nothing is published, and `pullPolicy: Never` below is what guarantees the
      # cluster uses the image we loaded rather than reaching for a registry that has no such tag.
      SPEC: packaging/reference/kind/acp-deployment.yaml
      NAMESPACE: acp-kind
      IMAGE: acp-app:ci
      # Pinned for the same reason every other version here is: a CNI that moves under the run
      # makes a green job unattributable. Bump deliberately, with a run behind it.
      CALICO_VERSION: v3.28.2
      # CRDs ONLY, not the operators. See the dry-run step for why that is the right
      # amount of KEDA and External Secrets to install here.
      KEDA_CRDS_VERSION: v2.16.0
      ESO_CRDS_VERSION: v0.10.5
      KIND_CLUSTER: acp-reference
      PYTHONPATH: packaging/cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: acpctl's own dependency
        # acpctl reads JSON with the standard library alone (PRD S17's air-gapped bundle needs
        # that); the documents here are YAML, so this is the one thing it needs.
        run: python -m pip install --disable-pip-version-check PyYAML

      # ── the image ──────────────────────────────────────────────────────────
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache .NET (NuGet) packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('spike/dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the Office analyser CLI
        # THE ONE THING A PLAIN CHECKOUT DOES NOT ALREADY HAVE. deploy/public/Dockerfile COPYs
        # spike/dotnet/AcpScan.Cli/bin/Release/net10.0/, and bin/ is gitignored — every other COPY
        # source is tracked (ADR 0029 vendored the PDF engine, which is what made a CI build
        # possible at all). Docker COPY of a missing directory is a hard failure, not a degraded
        # image, so this step is a prerequisite and not an optimisation. Same command as CI's.
        run: dotnet build spike/dotnet/AcpScan.Cli/AcpScan.Cli.csproj -c Release --nologo

      - name: Build the application image
        # From-scratch bases (mirror.gcr.io node:20-slim and python:3.12-slim, the Dockerfile's own
        # defaults) — no private registry is involved anywhere in this job. redeploy.sh's prebuilt
        # acp-base-* images are an ACR cache optimisation and deliberately not used here.
        #
        # STAMPED, BECAUSE AN UNSTAMPED IMAGE CANNOT SAY WHAT IT IS. `BUILD_VERSION` defaults to
        # `dev` in the Dockerfile and `/healthz` reports `version_stamped: false` for exactly that
        # value — the signal it uses to refuse an image nobody can identify. PRD §5.1 requires
        # every image to expose build version metadata, so a reference cluster running an image
        # that cannot name itself is testing something no release resembles, and the acceptance
        # suite's first scenario would fail on it correctly and uselessly.
        #
        # This does NOT change the image TAG, so `acpctl status`'s expected `release.version` drift
        # below is unaffected: that check reads the `app.kubernetes.io/version` label, which comes
        # from the tag, not from these build arguments.
        run: |
          docker build -f deploy/public/Dockerfile -t "$IMAGE" \
            --build-arg BUILD_VERSION="0.0.0-kind.${GITHUB_RUN_NUMBER}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BUILD_SHA="$GITHUB_SHA" \
            .

      # ── the cluster ────────────────────────────────────────────────────────
      - name: Install helm and kind
        run: |
          bash scripts/install_helm.sh
          bash scripts/install_kind.sh

      - name: Create the disposable cluster
        # NO `--wait` ON `kind create`. The cluster config disables kind's default CNI, so no node
        # can reach Ready until Calico is running — waiting here would time out on a cluster that
        # is behaving exactly as intended. The wait moves below, after the CNI.
        run: |
          set -euo pipefail
          kind create cluster --config packaging/reference/kind/cluster.yaml
          kubectl cluster-info
          # WHICH BYTES THIS CLUSTER ACTUALLY RAN. cluster.yaml pins the node image by TAG and says
          # why: everything else in this packaging work is pinned by digest, and inventing one
          # before any run had recorded which one it pulled would have been a pin to bytes nobody
          # had seen. Runs have recorded it now, so this prints it — the digest that appears here
          # is what a later commit can pin, sourced from a run rather than from a registry lookup.
          docker image inspect "$(python -c "
          import yaml
          print(yaml.safe_load(open('packaging/reference/kind/cluster.yaml'))['nodes'][0]['image'])
          ")" --format 'node image digest: {{index .RepoDigests 0}}' || true

      - name: A CNI that enforces the policies the chart renders
        # THE POINT OF REPLACING kindnet, and it is not tidiness. `templates/networkpolicy.yaml`
        # says it in its own header: "Kubernetes silently ignores NetworkPolicy objects when the
        # CNI does not implement them — no error, no event, no status field saying 'unenforced'."
        # kindnet is such a CNI. Every run before this one installed four policies and established
        # nothing about any of them.
        #
        # The concrete cost was `networkPolicy.egressPorts` (53, 443, 5432, 6379, 6380). With
        # nothing enforcing it, a missing port could not stop anything and the install passed
        # either way — a check that cannot fail, which is the shape this job exists to refuse.
        # With Calico running, the install ITSELF tests that list: a worker that cannot reach
        # Postgres or Redis does not come up.
        #
        # Calico rather than Cilium because `acpctl doctor` already recognises `calico-node` as an
        # enforcing CNI, so this also exercises that detection against a real one instead of a
        # table entry. Pinned, for the same reason the node image is.
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide
          kubectl -n kube-system get daemonset

      - name: Load the image into the cluster
        # NO REGISTRY. This is what makes the whole job self-contained: kind copies the local image
        # into the node's containerd, and `image.pullPolicy: Never` below makes Kubernetes use it.
        # An install that reached a registry would be testing the registry as much as the chart.
        run: kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      # ── the prerequisites the chart does not own ───────────────────────────
      - name: Data services
        # The chart REFUSES to render in-cluster Postgres, Redis or object storage (ADR 0048), so
        # they are supplied here exactly as an infrastructure adapter would supply them on a cloud:
        # as endpoints in a Secret. Credentials are generated per run and never leave the cluster.
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE"
          # ENFORCE THE RESTRICTED POD SECURITY STANDARD, so "restricted pod security where
          # technically possible" (PRD S5.B) stops being a claim about YAML and becomes something
          # the API server decides. A pod that does not meet it is REJECTED at admission, so the
          # install fails rather than the chart merely looking compliant — which is the difference
          # between this job and a rendered-manifest test.
          kubectl label namespace "$NAMESPACE" \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=latest
          PGUSER=acp
          PGPASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          kubectl -n "$NAMESPACE" create secret generic acp-reference-data \
            --from-literal=postgres-user="$PGUSER" \
            --from-literal=postgres-password="$PGPASSWORD"
          # `--warnings-as-errors` TURNS A LATE TIMEOUT INTO A NAMED FAILURE. Pod Security runs
          # admission on the POD, so a Deployment whose template violates the standard is created
          # happily and simply never produces a pod: the run dies three minutes later on
          # `rollout status` with "0 out of 1 new replicas", and nothing to describe. The API
          # server does say what is wrong — as a WARNING on the apply, which scrolls past. This
          # promotes it, so the message that names the missing fields is the message that fails.
          kubectl -n "$NAMESPACE" apply --warnings-as-errors \
            -f packaging/reference/kind/data-services.yaml
          kubectl -n "$NAMESPACE" rollout status deployment/acp-postgres --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/acp-redis --timeout=120s
          # The keys are the deployment document's `secrets.refs` names; the chart projects each
          # one as an uppercase env var (database-url -> DATABASE_URL), so the names here and in
          # the document are the same fact and must not be edited apart.
          kubectl -n "$NAMESPACE" create secret generic acp-secrets \
            --from-literal=database-url="postgresql://${PGUSER}:${PGPASSWORD}@acp-postgres:5432/acpdb?sslmode=disable" \
            --from-literal=redis-url="redis://acp-redis:6379/0" \
            --from-literal=object-storage="none"

      # ── the install ────────────────────────────────────────────────────────
      - name: Can this cluster run the document?
        # `acpctl doctor` before installing, which is what it is for. It cannot exit 0 here, so
        # `|| true` is right — and on its own that made this step DECORATIVE: it printed a report
        # nothing read, and doctor could have stopped reporting anything at all without the job
        # noticing. So the exact findings are asserted, the same way the drift check below names
        # the one drift it expects.
        #
        # THE COMMENT THIS REPLACES WAS WRONG IN BOTH DIRECTIONS, which is the reason for asserting
        # rather than describing. It said NetworkPolicy was expected "as a blocker". Measured:
        #
        #   [FAIL] capacity.floor  FAIL, severity BLOCKER — the only finding now, and the one no
        #          comment ever mentioned. doctor computes the floor from the DOCUMENT (5 CPU for
        #          five `small` pods) while this job installs with runner-resources.yaml lowering
        #          the requests, so doctor is right about the document and is describing something
        #          other than what gets installed. `acpctl doctor` takes no values overlay; see
        #          the gap report.
        #
        # `networkpolicy.enforcement` WAS the second finding — UNKNOWN at WARNING severity, since
        # kindnet is in neither the enforcing nor the known-non-enforcing CNI list, so not a
        # blocker and not a pass. Installing Calico turned it into a pass, so this expectation now
        # covers doctor's CNI detection against a REAL enforcing CNI rather than against a table
        # entry. It changed here only because the cluster changed, which is exactly the coupling
        # this assertion exists for.
        #
        # The expected findings must all be present and nothing else may be non-pass. A check that
        # stops firing fails this step: an expected finding that vanishes is a finding.
        run: |
          set -euo pipefail
          python -m acpctl doctor "$SPEC" -n "$NAMESPACE" || true
          python -m acpctl doctor "$SPEC" -n "$NAMESPACE" --json > /tmp/doctor.json || true
          python - <<'PY'
          import json, sys

          EXPECTED = {"capacity.floor": "fail"}
          report = json.load(open("/tmp/doctor.json"))
          assert report["reachable"], report
          found = {c["id"]: c["status"] for c in report["checks"] if c["status"] != "pass"}
          if found != EXPECTED:
              print("doctor's findings on the reference cluster have changed.", file=sys.stderr)
              print(f"  expected: {EXPECTED}", file=sys.stderr)
              print(f"  found:    {found}", file=sys.stderr)
              print("Update this step and packaging/docs/kubernetes-mvp-gap-report.md together, "
                    "or fix what regressed.", file=sys.stderr)
              sys.exit(1)
          print("doctor reports exactly the two findings this cluster is known to produce:")
          print(json.dumps([c for c in report["checks"] if c["status"] != "pass"], indent=2))
          PY

      - name: Install
        run: |
          set -euo pipefail
          python -m acpctl values "$SPEC" > /tmp/values.yaml
          helm install acp packaging/chart/acp \
            --namespace "$NAMESPACE" \
            -f /tmp/values.yaml \
            -f packaging/reference/kind/runner-resources.yaml \
            --set image.repository="${IMAGE%%:*}" \
            --set image.workerRepository="${IMAGE%%:*}" \
            --set image.tag="${IMAGE##*:}" \
            --set image.pullPolicy=Never \
            --set secrets.existingSecret=acp-secrets \
            --wait --timeout 10m

      - name: Every tier rolled out
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deployment/acp-api --timeout=300s
          for role in discover assess remediate; do
            kubectl -n "$NAMESPACE" rollout status "deployment/acp-worker-$role" --timeout=300s
          done

      - name: The workers registered and are heartbeating
        # THE ASSERTION THAT WOULD HAVE CAUGHT THE COMMAND DEFECT. A worker Deployment running the
        # API rolls out perfectly and never writes a heartbeat, so `rollout status` above passes
        # and this does not. /readyz reports `workers.roles.<role>.alive` and is unauthenticated.
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/acp-api 8077:80 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.request, sys

          ROLES = ("discovery", "assess", "remediate")
          deadline = time.time() + 300
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8077/readyz", timeout=10) as r:
                      last = json.load(r)
              except Exception as exc:                       # the forward may not be up yet
                  last = {"error": str(exc)}
                  time.sleep(5)
                  continue
              roles = (last.get("workers") or {}).get("roles") or {}
              if all(roles.get(role, {}).get("alive") for role in ROLES):
                  print("every worker tier is registered and heartbeating:")
                  print(json.dumps(roles, indent=2))
                  sys.exit(0)
              time.sleep(5)

          print("worker tiers never reported alive within 300s", file=sys.stderr)
          print(json.dumps(last, indent=2)[:4000], file=sys.stderr)
          sys.exit(1)
          PY

      - name: Are the network policies enforced, or merely accepted?
        # THE CLAIM `templates/networkpolicy.yaml` SAYS IT CANNOT MAKE, now made by the cluster.
        # Its header: "Kubernetes silently ignores NetworkPolicy objects when the CNI does not
        # implement them — no error, no event, no status field saying 'unenforced'." Every run
        # before Calico installed four policies and established nothing about any of them.
        #
        # THE DISCRIMINATOR IS TIMEOUT VERSUS REFUSED, and choosing the target carefully is the
        # whole design. Probing a Service port with no backend times out whether or not a policy
        # exists, so it proves nothing. This probes the POSTGRES POD IP directly:
        #
        #   port 5432   in `networkPolicy.egressPorts`   -> must CONNECT
        #   port 12345  not in the list, nothing listening on the pod
        #                 enforced     -> the packet is DROPPED       -> timeout
        #                 unenforced   -> the packet reaches the pod  -> RST -> refused
        #
        # So `refused` is the finding: it means the policies are decoration. Postgres pods carry
        # none of this chart's labels, so no ingress policy applies to them and the only thing
        # that can drop the packet is ACP's own egress policy — which is what makes this a
        # statement about that policy rather than about the cluster in general.
        #
        # Resolving the name at all exercises 53/UDP, the port whose absence made every earlier
        # version of the default-deny policy unusable.
        run: |
          set -euo pipefail
          PGIP="$(kubectl -n "$NAMESPACE" get pod -l app=acp-postgres \
            -o jsonpath='{.items[0].status.podIP}')"
          test -n "$PGIP" || { echo "no postgres pod IP; this check would prove nothing"; exit 1; }
          echo "probing $PGIP from an acp-api pod"
          kubectl -n "$NAMESPACE" exec -i deploy/acp-api -- python - "$PGIP" <<'PROBE'
          import socket, sys

          target = sys.argv[1]

          def probe(port, timeout=8):
              sock = socket.socket()
              sock.settimeout(timeout)
              try:
                  sock.connect((target, port))
                  return "connected"
              except socket.timeout:
                  return "timeout"
              except ConnectionRefusedError:
                  return "refused"
              except OSError as exc:
                  return f"error: {exc}"
              finally:
                  sock.close()

          try:
              socket.gethostbyname("acp-postgres")
              print("DNS resolves, so 53/UDP egress is permitted")
          except OSError as exc:
              sys.exit(f"DNS failed ({exc}); 53/UDP is not reaching the cluster resolver")

          allowed = probe(5432)
          if allowed != "connected":
              sys.exit(f"5432 is in networkPolicy.egressPorts and came back {allowed!r}; "
                       f"the egress policy is blocking a port the application needs")
          print("5432 connected, as the egress list says it should")

          denied = probe(12345)
          if denied == "refused":
              sys.exit("12345 was REFUSED, not dropped — the packet reached the pod, so the "
                       "NetworkPolicies are accepted and not enforced. That is the failure this "
                       "step exists to catch; every policy this chart renders is decoration.")
          if denied != "timeout":
              sys.exit(f"12345 came back {denied!r}; expected a timeout from a dropped packet")
          print("12345 timed out, so the egress policy is dropping what it does not allow")
          PROBE
          # THE INGRESS HALF, PROBED FROM OUTSIDE THE RELEASE. The document sets
          # `publicIngress: false`, so the `-api` policy admits only pods carrying this chart's
          # selector labels. The install already tests the ALLOWING half — the preflight hook
          # carries those labels and reached the API — but an over-broad selector (every pod in
          # the namespace, say) would pass that and tighten nothing.
          #
          # Postgres is the probe: it is in this namespace, it carries none of the chart's labels,
          # and no egress policy applies to it, so the API's ingress rule is the only thing that
          # can stop it.
          #
          # THE POSITIVE CONTROL IS THE POINT. "Did not connect" is also what a broken probe looks
          # like — no bash /dev/tcp, no DNS, no `timeout` — and each would read as a policy that
          # works. So it opens a socket to itself FIRST, and reports a broken mechanism rather
          # than a passing check when that fails.
          kubectl -n "$NAMESPACE" exec deploy/acp-postgres -- bash -c '
            set -u
            if ! timeout 5 bash -c "exec 3<>/dev/tcp/acp-postgres/5432" 2>/dev/null; then
              echo "this pod cannot open a socket to itself, so the probe below would be" >&2
              echo "meaningless: bash /dev/tcp, DNS or timeout is unavailable here." >&2
              exit 1
            fi
            echo "control: a socket from this pod works, so a refusal below means the policy"
            if timeout 8 bash -c "exec 3<>/dev/tcp/acp-api/80" 2>/dev/null; then
              echo "acp-api:80 ACCEPTED a connection from a pod carrying none of the release" >&2
              echo "labels; the ingress rule is not restricting anything." >&2
              exit 1
            fi
            echo "acp-api refused a pod outside the release, as the ingress policy says it should"
          '

      - name: Is what is running still what the document says?
        # ONE DRIFT IS EXPECTED HERE, AND EXACTLY ONE. The image is built from this checkout and
        # loaded under a local tag, so `release.version` correctly reports that the cluster runs
        # `ci` while the document names a release. That is `acpctl status` being right, not a
        # problem to paper over — and tagging the local build with the document's version to
        # silence it would be the same false pin PRD S5.1 exists to prevent.
        #
        # So the expected drift is named and everything else must pass. A second drift, or a
        # different one, fails the job.
        run: |
          set -euo pipefail
          python -m acpctl status "$SPEC" -n "$NAMESPACE" || true
          python -m acpctl status "$SPEC" -n "$NAMESPACE" --json > /tmp/status.json || true
          python - <<'PY'
          import json, sys

          report = json.load(open("/tmp/status.json"))
          expected = "release.version"
          assert report["reachable"] and report["installed"], report
          bad = [c for c in report["checks"]
                 if c["status"] != "pass" and c["id"] != expected]
          if bad:
              print("unexpected drift or failure:", file=sys.stderr)
              print(json.dumps(bad, indent=2), file=sys.stderr)
              sys.exit(1)
          drift = [c for c in report["checks"] if c["id"] == expected]
          if not drift:
              print(f"{expected} was not reported at all — this check would pass vacuously",
                    file=sys.stderr)
              sys.exit(1)
          if drift[0]["status"] == "pass":
              print(f"{expected} passed, but this job installs a locally-tagged image and the "
                    f"document names a release; something is comparing the wrong thing",
                    file=sys.stderr)
              sys.exit(1)
          print("every check passes except the expected release-tag drift:")
          print(json.dumps(drift[0], indent=2))
          PY

      - name: The manifests this install never creates
        # WHAT THE REFERENCE DOCUMENT LEAVES UNTESTED, counted rather than guessed at. It renders
        # NetworkPolicy, PodDisruptionBudget, ServiceAccount, one Service, four Deployments and
        # two Jobs. The standard-production example renders all of that PLUS a
        # HorizontalPodAutoscaler, an Ingress, an ExternalSecret, two ScaledObjects, a
        # TriggerAuthentication, two more Services and the Ollama and Grafana Deployments.
        #
        # None of those had ever been submitted to an API server. The annotation-type defect found
        # on 2026-09-08 was in six render sites and the reference install exercises three of them —
        # so the same bug in ollama.yaml or grafana.yaml would have shipped.
        #
        # A SERVER-SIDE DRY RUN COSTS SECONDS AND IS THE SAME KIND OF EVIDENCE as the install: the
        # API server validates the schema and runs admission, including Pod Security, so the
        # namespace carries the restricted label for the same reason the real one does. Nothing is
        # persisted, so this cannot disturb the release running next door.
        #
        # THE THREE CRD-DEPENDENT KINDS ARE SKIPPED, AND THE SKIP IS ASSERTED. ExternalSecret needs
        # external-secrets.io and ScaledObject/TriggerAuthentication need keda.sh, neither of which
        # is installed here — `doctor` reports both as blockers on a real cluster, which is its
        # job. Listing them by name means a NEW kind that depends on a CRD fails this step instead
        # of being skipped quietly, which is the failure mode the whole job exists to refuse.
        run: |
          set -euo pipefail
          kubectl create namespace acp-dryrun
          kubectl label namespace acp-dryrun \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=latest
          # THE CRDs, AND ONLY THE CRDs. `--dry-run=server` validates a custom resource against
          # its CustomResourceDefinition's schema, which needs the definition present and nothing
          # else — no controller, no webhook, no reconciliation. Installing the KEDA and External
          # Secrets OPERATORS would test their behaviour rather than this chart's manifests, take
          # minutes rather than seconds, and give `acpctl doctor` two fewer blockers to report,
          # which is the opposite of useful: doctor blocking on their absence is correct.
          #
          # Their apiVersions match what these bundles serve — keda.sh/v1alpha1 for ScaledObject
          # and TriggerAuthentication, external-secrets.io/v1beta1 for ExternalSecret — so a
          # rejection here is about the manifests, not about a version skew.
          kubectl apply --server-side -f \
            "https://github.com/kedacore/keda/releases/download/${KEDA_CRDS_VERSION}/keda-${KEDA_CRDS_VERSION#v}-crds.yaml"
          kubectl apply --server-side -f \
            "https://raw.githubusercontent.com/external-secrets/external-secrets/${ESO_CRDS_VERSION}/deploy/crds/bundle.yaml"
          # A CRD is not servable the instant it is created; applying a custom resource against
          # one that is not established yet fails with "no matches for kind", which reads as a
          # broken manifest and is not.
          for crd in scaledobjects.keda.sh triggerauthentications.keda.sh \
                     externalsecrets.external-secrets.io; do
            kubectl wait --for=condition=established --timeout=60s "crd/$crd"
          done
          python -m acpctl values packaging/examples/standard-production.acp-deployment.yaml \
            > /tmp/full-values.yaml
          # BACKUP AND RESTORE ARE OFF BY DEFAULT AND ARE NOT IN A DEPLOYMENT DOCUMENT, so the
          # values above render neither. Without these flags the CronJob, its PVC and the restore
          # Job would be the only objects in the chart never submitted to an API server — which is
          # the exact gap this step was added to close for ollama and grafana.
          helm template acp packaging/chart/acp \
            -f /tmp/full-values.yaml \
            -f packaging/reference/kind/runner-resources.yaml \
            --set backup.enabled=true \
            --set backup.schedule='0 2 * * *' \
            --set backup.retentionDays=35 \
            --set restore.enabled=true \
            --set restore.file=acp-20260908T020000Z.dump \
            --set restore.runId=dryrun \
            --set restore.confirm=acp \
            --set image.pullPolicy=Never > /tmp/full.yaml
          python - <<'PY'
          import sys, yaml

          # NOTHING IS SKIPPED NOW, and these three are the reason the CRDs are installed above.
          # Named rather than counted, because a render that stopped producing them would leave
          # this step passing over a smaller set and reporting nothing about it.
          NEEDED_CRDS = {"ExternalSecret", "ScaledObject", "TriggerAuthentication"}
          # The same reasoning for the objects that exist only behind a flag: they are rendered
          # by the --set block above, and a chart that stopped producing them would leave this
          # step green while covering less than it says.
          NEEDED_OPTIONAL = {"CronJob", "PersistentVolumeClaim"}
          docs = [d for d in yaml.safe_load_all(open("/tmp/full.yaml")) if d]
          kinds = {d["kind"] for d in docs}
          missing = sorted((NEEDED_CRDS | NEEDED_OPTIONAL) - kinds)
          if missing:
              print(f"the render no longer produces {missing}, so this step covers less than it "
                    f"claims. Either the chart changed or the example did; do not simply drop "
                    f"them from this list.", file=sys.stderr)
              sys.exit(1)
          print(f"dry-running all {len(docs)} manifests: {sorted(kinds)}")
          PY
          kubectl apply --dry-run=server --warnings-as-errors \
            -n acp-dryrun -f /tmp/full.yaml
          kubectl delete namespace acp-dryrun --wait=false

      - name: Can it be upgraded, or only installed?
        # AN INSTALL THAT CANNOT BE UPGRADED IS A DEMO. Every failure mode below is invisible to
        # both `helm template` and a first install, and each one strands a running installation:
        #
        #   - `spec.selector` is IMMUTABLE on a Deployment. A selector label that varies with
        #     anything — the release version, a tag, a checksum — installs perfectly and makes
        #     every later upgrade fail with a message about a field that cannot be changed.
        #   - A hook Job is a NAMED object. Without `before-hook-creation` in its delete policy
        #     the second release finds the first one's Job still there and fails to create it.
        #     Both hooks here carry the policy; this is what proves it rather than reading it.
        #   - The migration hook runs `pre-upgrade` as well as `pre-install`, so it runs against
        #     a schema it has already applied. A migration that is not idempotent fails HERE and
        #     nowhere earlier.
        #
        # The upgrade changes the pod template (a podAnnotation) so it is a real rolling update
        # rather than a no-op Helm reports as deployed. Requests are small enough that the surge
        # pod fits: 600m of the runner's 4000m is in use.
        #
        # THE ANNOTATION KEY CARRIES NO DOMAIN PREFIX, AGAINST THIS REPOSITORY'S HABIT, and that
        # is deliberate. `--set podAnnotations."acp\.mova\.io/upgrade-probe"=x` does not mean what
        # it looks like: helm treats the quotes as part of the KEY, producing the annotation
        # `"acp.mova.io/upgrade-probe"` with literal quote characters, which Kubernetes rejects as
        # an invalid key — so the upgrade fails on validation, not on anything this step is for.
        # Measured with `helm template`, all three forms:
        #
        #   podAnnotations."acp\.mova\.io/upgrade-probe"=x  ->  {'"acp.mova.io/upgrade-probe"': 'x'}
        #   podAnnotations.acp\.mova\.io/upgrade-probe=x    ->  {'acp.mova.io/upgrade-probe': 'x'}
        #   podAnnotations.upgrade-probe=x                 ->  {'upgrade-probe': 'x'}
        #
        # The middle form works and depends on backslashes surviving the shell, the workflow's
        # block scalar and helm's parser intact. A key with no dots needs none of that, and the
        # same choice keeps the jsonpath below a plain path rather than a second escaping puzzle.
        # This is a CI probe, not a product annotation.
        run: |
          set -euo pipefail
          helm upgrade acp packaging/chart/acp \
            --namespace "$NAMESPACE" \
            -f /tmp/values.yaml \
            -f packaging/reference/kind/runner-resources.yaml \
            --set image.repository="${IMAGE%%:*}" \
            --set image.workerRepository="${IMAGE%%:*}" \
            --set image.tag="${IMAGE##*:}" \
            --set image.pullPolicy=Never \
            --set secrets.existingSecret=acp-secrets \
            --set podAnnotations.upgrade-probe="$GITHUB_RUN_ID" \
            --wait --timeout 10m
          kubectl -n "$NAMESPACE" rollout status deployment/acp-api --timeout=300s
          for role in discover assess remediate; do
            kubectl -n "$NAMESPACE" rollout status "deployment/acp-worker-$role" --timeout=300s
          done
          # `helm upgrade --wait` returns success for a release whose revision did not advance,
          # so the revision is checked rather than the exit status.
          helm -n "$NAMESPACE" history acp
          REVISION="$(helm -n "$NAMESPACE" status acp -o json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test "$REVISION" -ge 2 || { echo "release is still at revision $REVISION"; exit 1; }
          # The annotation is what made this a real rolling update. If it is not on the running
          # pods, the upgrade replaced nothing and everything above passed vacuously.
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/component=api \
            -o jsonpath='{.items[*].metadata.annotations.upgrade-probe}' \
            | grep -q "$GITHUB_RUN_ID"

      - name: Does the installation pass the portable acceptance suite?
        # THE QUESTIONS THIS JOB DID NOT ASK. Everything above is about the PACKAGING: does the
        # chart render, install, upgrade, and are its policies enforced. The acceptance suite asks
        # about the INSTALLATION — do workers claim queued work, does live progress reach a
        # client, does a tier restarted mid-job lose anything — and PRD §7/§9 make its report the
        # only thing that can move a target off `planned`. Until this step existed the suite had
        # never run against an API server, and "the suite passes" meant "the suite agrees with the
        # fake we wrote alongside it".
        #
        # RUN LAST, AGAINST THE UPGRADED RELEASE, because that is the installation an operator
        # ends up with. A suite that only ever sees a first install certifies the easy half.
        #
        # THIS DOES NOT CERTIFY kind. The descriptor explains why at length: no registry, so no
        # digest to pin; no previous release; data services that are a convenience rather than
        # managed. The report it writes carries an unpinned release and grants four capabilities
        # of eight, so four scenarios SKIP with a reason. That is the honest shape of a run on a
        # target nobody intends to support, and it is still the only place the suite meets a real
        # cluster on every packaging PR.
        env:
          ACP_ACCEPTANCE_BASE_URL: http://127.0.0.1:8078
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/acp-api 8078:80 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          # WAIT FOR THE FORWARD, AND FAIL IF IT NEVER COMES UP. `port-forward` backgrounds
          # instantly and takes a moment to bind; running the suite against a closed port produces
          # ten `unknown` results whose cause is a race, not the target — which is precisely the
          # kind of report this suite exists to not produce.
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "$ACP_ACCEPTANCE_BASE_URL/healthz" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 5 "$ACP_ACCEPTANCE_BASE_URL/healthz" \
            || { echo "the port-forward never became usable; the run below would establish nothing"; exit 1; }

          export PYTHONPATH=packaging/acceptance
          # The suite's exit codes are 0 pass / 1 mandatory failure / 2 could-not-run, and the
          # assertion below reads the REPORT rather than the code: on this target some scenarios
          # cannot pass for reasons that are known, named and not defects, so `exit 2` is the
          # expected outcome and a bare `set -e` would fail the job on it.
          set +e
          python -m acp_acceptance.run \
            --target packaging/reference/kind/acceptance-target.yaml \
            --claim mvp \
            --out /tmp/acceptance/report.json
          SUITE_EXIT=$?
          set -e
          echo "acceptance suite exit: $SUITE_EXIT"

          python - <<'PY'
          import json, sys

          # WHAT THIS CLUSTER IS EXPECTED TO REPORT, AND WHY EACH ONE. Same posture as the doctor
          # step above: the expected outcomes must all be present and nothing else may differ, so
          # a scenario that stops firing fails this step. An expectation is a claim about the
          # target and gets an explanation, not a state on its own.
          EXPECTED = {
              # The installation answers, and names the build it was made from — which is only
              # true because the image build above stamps BUILD_VERSION.
              "api-readiness": "pass",
              # All three tiers registered and are heartbeating. The job asserts the same fact
              # against /readyz directly a few steps up; this asserts it through the suite, which
              # is what a certification run would read.
              "worker-registration": "pass",
              # Queued work is claimed by a worker and live progress reaches a client.
              "queue-and-progress": "pass",
              # MEASURED: run 34234894950 reached this scenario and it answered 503 from
              # `app.py`'s capacity guard when starting the assessment — the reference cluster is
              # already known to be under ACP's minimum (`capacity.floor` FAILs with "needs
              # 5000m, cluster has 4000m allocatable"). The suite now retries a 503 as the
              # application's `Retry-After` asks and reports a surviving one as `unknown`, so if
              # the fan-out cannot run here the report says the target was busy rather than that
              # it is broken. The reason assertion below then decides which of the two happened.
              #
              # UNKNOWN, AND NOT A DEFECT IN THE CLUSTER. `/scans/{sid}/artifacts` is a PRD §12
              # requirement no build serves yet, so the question "does every authoritative output
              # live in durable storage" cannot be asked here at all. The suite reports that as
              # `unknown` rather than as a pass, which is the whole reason it has four states.
              "fixture-workflow": "unknown",
              # NOW SERVED. `/admin/audit-events` and `/admin/support-bundle` landed with this
              # change, and startup records `deployment.started` so even an installation that has
              # changed nothing has a trail to return — which is what makes "no events" mean
              # "auditing is broken" rather than "nothing has happened yet".
              #
              # A PREDICTION UNTIL THIS JOB'S FIRST RUN, stated as one. It asserts audit events
              # exist, a bundle is returned, the bundle declares itself redacted, and none of this
              # run's own credentials appear in it. If the reference cluster disagrees, the run
              # says so and this line is corrected against what it measured — never widened.
              "audit-and-diagnostics": "pass",
              # STILL UNKNOWN, FOR A DIFFERENT AND BETTER REASON. The artifact inventory now
              # exists, so this scenario reaches it — and finds ZERO artifacts, because the runs
              # it drives are discover-only. "No duplicate authoritative outputs" is then
              # vacuously true, and reporting `pass` would be a check that could not have failed.
              # The lost-work half DID hold and the outcome says so; the duplicate half needs a
              # target that can complete a remediation, which this cluster cannot (see above).
              "worker-restart": "unknown",
              # The four `supported`-claim scenarios. SKIPPED because the descriptor withholds
              # their capabilities, each for a reason it states; a skip is not a pass and costs
              # the claim, which is correct — this target is not a candidate for one.
              "dependency-degradation": "skip",
              "scale-updown": "skip",
              "upgrade-from-previous": "skip",
              "backup-restore": "skip",
          }

          report = json.load(open("/tmp/acceptance/report.json"))

          # THE REPORT MUST NOT CLAIM THIS RUN CERTIFIES ANYTHING. `synthetic` false says it met a
          # real target; both eligibility booleans false say it is still not evidence for a claim.
          # Asserting both is what stops a green kind job from being pasted into a status update
          # as "MVP eligible".
          assert report["synthetic"] is False, (
              "the suite reported this run as synthetic — it ran against the fake backend, not "
              "the cluster, and establishes nothing")
          claim = report["supportClaim"]
          assert not claim["mvpEligible"] and not claim["supportedEligible"], (
              f"a kind run reported itself eligible for a support claim: {claim}")

          # AND WHY, NOT ONLY WHAT. Comparing states alone lets a scenario keep its expected
          # `unknown` while the REASON changes underneath it — which nearly happened here: the
          # second run had `fixture-workflow` unknown-adjacent for a 503 from the capacity guard
          # rather than for the missing artifact inventory, and a state-only check would have
          # gone green on a run that established something completely different. Substrings, so
          # wording can change without a false alarm; the cause cannot.
          EXPECTED_REASON = {
              # MEASURED, NOT PREDICTED, and this is the reason assertion doing its job on its
              # first run. The expectation here WAS "/artifacts" — the missing durable-output
              # inventory. Run 34236164828 showed something else: `POST /scans/{sid}/assess`
              # answers 503 `DB_CAPACITY_BUSY` and keeps answering it, so the scenario never
              # reaches the artifact probe at all. A state-only check would have gone green on
              # that, because `unknown` is `unknown` whatever the cause.
              #
              # IT IS THE CLUSTER'S SIZE, AND TWO INDEPENDENT READINGS SAY SO. `capacity.floor`
              # FAILs in the doctor step above — "needs 5000m, cluster has 4000m allocatable" —
              # and here the application's own admission gate refuses a mutation after its 5s
              # timeout. Connections are not the constraint: Postgres serves the document's
              # declared 200 and each API replica asks for ~20. A one-node runner sharing 4 CPU
              # between the control plane, Calico, Postgres, Redis, two API replicas and three
              # workers cannot also run a download-and-analyse fan-out.
              #
              # So scenario 4 is UNANSWERABLE on this target, and that is recorded rather than
              # absorbed: the report says the target was busy, never that it passed, and no claim
              # moves. If the cluster is ever given headroom the scenario will reach `/artifacts`
              # and THIS ASSERTION WILL FAIL — which is the correct outcome and the signal to
              # change this line back.
              "fixture-workflow": "DB_CAPACITY_BUSY",
              "worker-restart": "no authoritative artifacts",
              "dependency-degradation": "fault-injection",
              "scale-updown": "scale-control",
              "upgrade-from-previous": "previous-release",
              "backup-restore": "backup-restore",
          }

          found = {s["id"]: s["state"] for s in report["scenarios"]}
          detail_of = {s["id"]: s["detail"] for s in report["scenarios"]}
          wrong_reason = {sid: detail_of.get(sid, "")
                          for sid, needle in EXPECTED_REASON.items()
                          if found.get(sid) == EXPECTED.get(sid)
                          and needle not in detail_of.get(sid, "")}
          if wrong_reason:
              print("a scenario reported its expected state for an UNEXPECTED reason:",
                    file=sys.stderr)
              for sid, detail in wrong_reason.items():
                  print(f"  {sid}: expected the reason to mention "
                        f"{EXPECTED_REASON[sid]!r}\n    got: {detail}", file=sys.stderr)
              print("\nThat is a different measurement wearing the same label. Update this table "
                    "and the gap report together.", file=sys.stderr)
              sys.exit(1)

          if found != EXPECTED:
              differing = {k: (EXPECTED.get(k), found.get(k))
                           for k in sorted(set(EXPECTED) | set(found))
                           if EXPECTED.get(k) != found.get(k)}
              print("the acceptance suite's outcomes on the reference cluster have changed.",
                    file=sys.stderr)
              print("  id: (expected, found)", file=sys.stderr)
              for k, v in differing.items():
                  print(f"    {k}: {v}", file=sys.stderr)
              print("", file=sys.stderr)
              for entry in report["scenarios"]:
                  if entry["id"] in differing:
                      print(f"  {entry['id']}: {entry['detail']}", file=sys.stderr)
              print("\nA scenario that started passing is as much a change as one that stopped: "
                    "update this table and packaging/docs/kubernetes-mvp-gap-report.md together, "
                    "or fix what regressed. Do NOT widen the expectation to make a failure fit.",
                    file=sys.stderr)
              sys.exit(1)

          print("the reference cluster reports exactly the outcomes it is known to produce:")
          for entry in report["scenarios"]:
              print(f"  [{entry['state']:>7}] {entry['id']}: {entry['detail']}")
          PY

      - name: Keep the acceptance report
        # ALWAYS, INCLUDING ON FAILURE, because the report is the entire point: a failed step whose
        # evidence was thrown away costs a whole run to reproduce. It carries no credential — the
        # target block is an allow-list of five fields and the assembled report is grepped for
        # every value the descriptor supplied before it is written at all.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: /tmp/acceptance/
          if-no-files-found: warn

      - name: Is the backup restorable, or only written?
        # RUNS EVEN WHEN AN EARLIER STEP FAILED, AND THAT IS NOT LENIENCY. This step is
        # independent of the acceptance suite above: it needs an installed release and a
        # database, which the Install and rollout steps provide, and nothing the suite does or
        # fails to do changes what it measures. Left gated on the default `success()`, an
        # unrelated red step SKIPS it — and a check that never runs reports nothing while the job
        # is already red for another reason, so nobody notices it never ran.
        #
        # That is not hypothetical. Runs 34246312816 and 34247813128 both skipped this step
        # because the acceptance suite failed on `fixture-workflow` first, and on the second of
        # those the whole point of the commit was a fix to THIS step that consequently went
        # unproven.
        #
        # `!cancelled()` rather than `always()`, so a cancelled run stops here like everything
        # else. If the install genuinely did not happen, the `helm upgrade` below fails
        # immediately and says so, which is a better failure than a silent skip.
        if: ${{ !cancelled() }}
        # PRD S16: "A backup is not considered healthy until a restore test has succeeded within
        # the customer-defined interval." A CronJob that writes dumps nobody ever reads is exactly
        # the thing an installation believes in until the incident, so the restore is the half
        # that gets tested here — against the schema the migration hook really applied, on a
        # cluster that is deleted at the end of the run.
        #
        # WHAT THIS ESTABLISHES, IN ORDER, and none of it is visible to `helm template`:
        #
        #   * the CronJob's pod is ADMITTED under the restricted Pod Security Standard and can
        #     reach Postgres with the one credential it is given;
        #   * `pg_dump` produces an archive `pg_restore` can list — the chart's own check, run
        #     against a real database rather than asserted;
        #   * the restore REFUSES while the application is up. That guard runs before anything is
        #     dropped, so exercising it costs nothing and leaving it unexercised would make it a
        #     comment;
        #   * with the tiers scaled to zero, the restore puts back a row that was deleted after
        #     the backup was taken. That is the only statement here that a dump nobody can read
        #     would fail to make.
        #
        # THE REFUSAL IS RUN FIRST, DELIBERATELY. A restore that succeeds tells you nothing about
        # whether the guard works, and the guard is what stands between an operator and a
        # `--clean` under three live worker tiers.
        #
        # AND IT IS DRIVEN THROUGH `acpctl`, WHICH IS NEW. Until this step, NO acpctl command that
        # changes a cluster had ever run against a real API server: install, uninstall and
        # support-bundle are tested against an injected runner that answers the way helm and
        # kubectl are DOCUMENTED to answer, which establishes their logic and nothing about
        # kubectl. Four things here can only be settled by a cluster — that the backup CronJob is
        # findable by its labels rather than by a computed name, that `create job --from=cronjob/…`
        # produces a pod the restricted standard admits, that the log acpctl parses is the log
        # kubectl returns, and that the Job name it polls for is the one the chart rendered.
        #
        # `--quiesce` IS EXERCISED BY ITS REFUSAL, not by its success, and that is the honest
        # shape here: this release is installed by `helm install`, so there is no acp-installation
        # ConfigMap to record replica counts in, and scaling tiers to zero with no record of what
        # they were is exactly what that refusal exists to prevent. The scale-down below is done
        # by kubectl for the same reason. The success path stays covered by unit tests alone, and
        # packaging/docs/lifecycle.md says so.
        run: |
          set -euo pipefail
          # Turn the backup on. Everything the upgrade step passes, plus the two decisions the
          # chart refuses to make: a schedule (that will not fire inside this run — the job below
          # is created from the CronJob by hand) and a retention.
          #
          # NO `--wait` ON THIS ONE, AND THE REASON IS A REAL PROPERTY OF THE CHART RATHER THAN A
          # CI quirk. `helm --wait` waits for PersistentVolumeClaims to reach Bound. This upgrade
          # adds `<release>-backups`, and on a StorageClass whose volumeBindingMode is
          # WaitForFirstConsumer — kind's local-path, AWS gp3, and Azure's managed-csi default —
          # a claim stays Pending until a POD MOUNTS IT. The only pod that ever mounts this one is
          # the backup Job, which does not exist until the CronJob fires or `acpctl backup`
          # creates one. So `--wait` blocks for its whole timeout and then fails:
          #
          #   Error: UPGRADE FAILED: context deadline exceeded
          #   persistentvolumeclaim/acp-backups  waiting for first consumer to be created before binding
          #
          # measured on run 34241201489, ten minutes of it. Nothing here needs the wait anyway:
          # the pod template is unchanged from the previous step, so no rollout happens, and the
          # next command talks to Postgres rather than to anything this upgrade touched.
          #
          # THE SAME TRAP IS LIVE FOR OPERATORS and is written up in values.yaml beside
          # `backup.storage` and in docs/lifecycle.md — `acpctl install` passes `--wait --atomic`,
          # so on such a cluster enabling the backup would roll the whole release back.
          helm upgrade acp packaging/chart/acp \
            --namespace "$NAMESPACE" \
            -f /tmp/values.yaml \
            -f packaging/reference/kind/runner-resources.yaml \
            --set image.repository="${IMAGE%%:*}" \
            --set image.workerRepository="${IMAGE%%:*}" \
            --set image.tag="${IMAGE##*:}" \
            --set image.pullPolicy=Never \
            --set secrets.existingSecret=acp-secrets \
            --set podAnnotations.upgrade-probe="$GITHUB_RUN_ID" \
            --set backup.enabled=true \
            --set backup.schedule='0 2 * * *' \
            --set backup.retentionDays=7 \
            --set backup.storage.size=1Gi \
            --timeout 10m
          # The CronJob is what the next commands need, so assert it exists rather than inferring
          # it from an exit status that no longer waits for anything.
          kubectl -n "$NAMESPACE" get cronjob acp-backup -o name

          # The row the backup must carry and the restore must bring back. A table of its own
          # rather than an application row, because what is being tested is that the dump/restore
          # pair round-trips the database's contents — not that the API can write.
          kubectl -n "$NAMESPACE" exec deployment/acp-postgres -- psql -U acp -d acpdb -c \
            "create table acp_restore_drill(note text); insert into acp_restore_drill values ('$GITHUB_RUN_ID');"

          # THROUGH `acpctl backup`, NOT `kubectl create job`. This is the first time any acpctl
          # command that CHANGES a cluster has run against a real API server — install, uninstall
          # and support-bundle are all tested against an injected runner answering the way helm
          # and kubectl are documented to answer, which establishes their logic and nothing about
          # kubectl. Everything here is a claim that only a cluster can settle: that the CronJob
          # is findable by its labels, that `--from=cronjob/…` copies a pod template the
          # restricted standard admits, and that the log this parses is the log kubectl returns.
          python -m acpctl backup "$SPEC" -n "$NAMESPACE" --release-name acp --json \
            > /tmp/backup.json
          cat /tmp/backup.json
          DUMP="$(python -c 'import json;print(json.load(open("/tmp/backup.json"))["file"])')"
          test -n "$DUMP" || { echo "acpctl backup named no dump file"; exit 1; }
          python - <<'PY'
          import json, sys
          record = json.load(open("/tmp/backup.json"))
          # The fields acpctl PARSED out of the Job's own log. A record with a job name and
          # nothing else would mean the command reported that Kubernetes accepted a request.
          for key in ("file", "bytes", "objects", "retentionDays", "kept"):
              if key not in record:
                  print(f"acpctl backup --json omitted {key}: {record}", file=sys.stderr)
                  sys.exit(1)
          assert record["retentionDays"] == 7, record
          assert record["objects"] > 0 and record["bytes"] > 0, record
          print(f"backed up {record['file']}: {record['bytes']} bytes, "
                f"{record['objects']} objects, {record['kept']} kept")
          PY

          # THE LISTING, against a real cluster. No --from, so this must exit 2 and name the dump
          # it found by reading the backup Jobs' logs.
          set +e
          python -m acpctl restore "$SPEC" -n "$NAMESPACE" --release-name acp > /tmp/list.txt 2>&1
          LIST_CODE=$?
          set -e
          cat /tmp/list.txt
          test "$LIST_CODE" -eq 2 || { echo "restore with no --from exited $LIST_CODE"; exit 1; }
          grep -q "$DUMP" /tmp/list.txt

          # THE PREVIEW CHANGES NOTHING, and the proof is that the drill row is still there after
          # it — asserted below, once, after the row has been destroyed and brought back.
          python -m acpctl restore "$SPEC" -n "$NAMESPACE" --release-name acp \
            --from "$DUMP" | tee /tmp/preview.txt
          grep -q "PREVIEW ONLY" /tmp/preview.txt

          # --quiesce MUST REFUSE HERE, and that is the point of running it. This release was
          # installed by `helm install` rather than `acpctl install`, so there is no
          # acp-installation ConfigMap to record the replica counts in — and scaling the tiers to
          # zero with no record of what they were is exactly what the refusal exists to prevent.
          set +e
          python -m acpctl restore "$SPEC" -n "$NAMESPACE" --release-name acp \
            --from "$DUMP" --quiesce --yes > /tmp/noquiesce.txt 2>&1
          Q_CODE=$?
          set -e
          cat /tmp/noquiesce.txt
          test "$Q_CODE" -eq 1 || { echo "--quiesce exited $Q_CODE, expected a refusal"; exit 1; }
          grep -q "refusing --quiesce" /tmp/noquiesce.txt
          # And it refused BEFORE scaling anything: every tier is still up.
          kubectl -n "$NAMESPACE" rollout status deployment/acp-api --timeout=60s

          # THE JOB'S OWN GUARD, EXERCISED THROUGH THE CLI. The application is running, so this
          # must fail — and must be reported as a REFUSAL that changed nothing rather than as a
          # restore that broke something.
          set +e
          python -m acpctl restore "$SPEC" -n "$NAMESPACE" --release-name acp \
            --from "$DUMP" --run-id refusal --yes > /tmp/refusal.log 2>&1
          R_CODE=$?
          set -e
          cat /tmp/refusal.log
          test "$R_CODE" -eq 1 || { echo "the live-application restore exited $R_CODE"; exit 1; }
          grep -q "REFUSING:" /tmp/refusal.log
          grep -q "refused rather than failed" /tmp/refusal.log
          # And it refused BEFORE dropping anything: the row is still there.
          kubectl -n "$NAMESPACE" exec deployment/acp-postgres -- psql -U acp -d acpdb -tAc \
            "select note from acp_restore_drill" | grep -q "$GITHUB_RUN_ID"

          # Now the runbook's own first step. Replica counts are read off the cluster rather than
          # hardcoded, because they come from the deployment document and this step must not
          # quietly rewrite the topology the rest of the job installed.
          kubectl -n "$NAMESPACE" get deploy -l app.kubernetes.io/part-of=acp \
            -o jsonpath='{range .items[*]}{.metadata.name} {.spec.replicas}{"\n"}{end}' > /tmp/replicas.txt
          cat /tmp/replicas.txt
          kubectl -n "$NAMESPACE" scale deployment -l app.kubernetes.io/part-of=acp --replicas=0
          # Wait on the database's own view of it, which is the precondition the job checks —
          # not on pods, which can be Terminating with their connection still open.
          for _ in $(seq 60); do
            OPEN="$(kubectl -n "$NAMESPACE" exec deployment/acp-postgres -- psql -U acp -d acpdb -tAc \
              "select count(*) from pg_stat_activity where datname = 'acpdb' and pid <> pg_backend_pid()" | tr -d '[:space:]')"
            [ "$OPEN" = "0" ] && break
            sleep 5
          done
          test "$OPEN" = "0" || { echo "still $OPEN session(s) on the database"; exit 1; }

          # Destroy what the backup holds, then get it back — through the CLI this time, with the
          # tiers already down, which is the path `--quiesce` would have taken had there been an
          # install record to write the replica counts into.
          kubectl -n "$NAMESPACE" exec deployment/acp-postgres -- psql -U acp -d acpdb -c \
            "drop table acp_restore_drill;"
          python -m acpctl restore "$SPEC" -n "$NAMESPACE" --release-name acp \
            --from "$DUMP" --run-id drill --yes --json > /tmp/restore.json 2>/tmp/restore.log
          cat /tmp/restore.log
          cat /tmp/restore.json
          python - <<'PY'
          import json, sys
          record = json.load(open("/tmp/restore.json"))
          if "tables" not in record:
              print(f"acpctl restore --json omitted the table count: {record}", file=sys.stderr)
              sys.exit(1)
          assert record["tables"] > 0, record
          print(f"restored {record['from']} as {record['job']}: {record['tables']} tables")
          PY
          BACK="$(kubectl -n "$NAMESPACE" exec deployment/acp-postgres -- psql -U acp -d acpdb -tAc \
            "select note from acp_restore_drill" | tr -d '[:space:]')"
          test "$BACK" = "$GITHUB_RUN_ID" \
            || { echo "the restore did not bring the row back (got '$BACK')"; exit 1; }
          echo "restored: acp_restore_drill.note = $BACK"

          # Put the installation back the way the document describes it, so a green run does not
          # leave a topology nothing declared.
          while read -r deploy replicas; do
            kubectl -n "$NAMESPACE" scale "deployment/$deploy" --replicas="$replicas"
          done < /tmp/replicas.txt
          kubectl -n "$NAMESPACE" rollout status deployment/acp-api --timeout=300s
          for role in discover assess remediate; do
            kubectl -n "$NAMESPACE" rollout status "deployment/acp-worker-$role" --timeout=300s
          done

      # ── evidence, and then nothing survives ────────────────────────────────
      - name: What the cluster looked like
        if: always()
        # EVENTS AND JOBS, NOT ONLY PODS. The first run of this job failed with a pre-install hook
        # stuck at 0/1 and NO POD AT ALL — the ServiceAccount admission plugin had rejected the
        # pod, so `describe pods` printed the two data services and nothing else, and the reason
        # was in the Job's events, which nothing printed. A diagnostic step that cannot name the
        # failure it is there for costs a whole run.
        run: |
          kubectl -n "$NAMESPACE" get all -o wide || true
          kubectl -n "$NAMESPACE" describe jobs || true
          kubectl -n "$NAMESPACE" describe pods || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/part-of=acp --all-containers --tail=200 --prefix || true
          kubectl -n "$NAMESPACE" logs -l batch.kubernetes.io/job-name --all-containers --tail=200 --prefix || true

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true
