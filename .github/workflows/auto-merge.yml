name: Auto-merge on CI green

# TEMPORARY STOPGAP — see commit message. This intentionally does NOT auto-enable merge on
# anything. It only disables an already-armed auto-merge when hold-for-review is present, using
# the App-token identity (separate rate-limit pool from any individual account). Replace this
# file with #1041's reviewed content (or merge #1041, which does that) — do not extend this one.

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disable-if-held:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Fetch current PR labels
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          data=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json labels)
          echo "labels=$(echo "$data" | jq -c '[.labels[].name]')" >> "$GITHUB_OUTPUT"

      - name: Disable auto-merge if hold-for-review is present
        if: contains(fromJSON(steps.pr.outputs.labels), 'hold-for-review')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --disable-auto || true
