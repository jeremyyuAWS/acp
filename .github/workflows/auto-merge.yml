name: Auto-merge on CI green

# Opt-in only. hold-for-review always takes precedence.
# Keep the workflow disabled until its policy has been reviewed.
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - labeled
      - unlabeled

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Fetch current PR state
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          data=$(gh pr view "$PR_NUMBER" \
            --json labels,isDraft,autoMergeRequest)
          echo "labels=$(jq -c '[.labels[].name]' <<< "$data")" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.isDraft' <<< "$data")" >> "$GITHUB_OUTPUT"
          echo "armed=$(jq -r '.autoMergeRequest != null' <<< "$data")" >> "$GITHUB_OUTPUT"

      - name: Disable unauthorized auto-merge
        if: >-
          steps.pr.outputs.armed == 'true'
          && (
            contains(fromJSON(steps.pr.outputs.labels), 'hold-for-review')
            || !contains(fromJSON(steps.pr.outputs.labels), 'automerge')
            || steps.pr.outputs.draft == 'true'
          )
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --disable-auto

      - name: Enable squash auto-merge when explicitly authorized
        if: >-
          !contains(fromJSON(steps.pr.outputs.labels), 'hold-for-review')
          && contains(fromJSON(steps.pr.outputs.labels), 'automerge')
          && steps.pr.outputs.draft == 'false'
          && steps.pr.outputs.armed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash
