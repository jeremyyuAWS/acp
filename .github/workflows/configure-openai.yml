name: Configure production OpenAI credential
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bind existing credential to production services
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/configure_openai_secret.py
