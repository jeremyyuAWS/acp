name: start-staging-worker

on:
  workflow_dispatch:
    inputs:
      rg:
        description: "Resource group (default: mdk-accessibility)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  start-worker:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start worker if not Running
        env:
          ACP_RG: ${{ inputs.rg || vars.STAGING_RG || 'mdk-accessibility' }}
          ACP_DISCOVERY_WORKER: ${{ vars.STAGING_DISCOVERY_WORKER || 'acp-discovery-staging' }}
          ACP_ASSESS_WORKER: ${{ vars.STAGING_ASSESS_WORKER || 'acp-assess-staging' }}
          ACP_REMEDIATE_WORKER: ${{ vars.STAGING_REMEDIATE_WORKER || 'acp-remediate-staging' }}
          ACP_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for ACP_WORKER in "$ACP_DISCOVERY_WORKER" "$ACP_ASSESS_WORKER" "$ACP_REMEDIATE_WORKER"; do
            case "$ACP_WORKER" in *-staging) ;; *) echo "ERROR: refusing non-staging worker $ACP_WORKER"; exit 1 ;; esac
            STATUS=$(az containerapp show --subscription "$ACP_SUBSCRIPTION" \
              -g "$ACP_RG" -n "$ACP_WORKER" \
              --query properties.runningStatus -o tsv 2>/dev/null || echo "NotFound")
            echo "$ACP_WORKER: $STATUS"
            if [ "$STATUS" != "Running" ]; then
              [ "$STATUS" != "NotFound" ] || { echo "ERROR: provision roles with staging_up.sh first"; exit 1; }
              az containerapp start --subscription "$ACP_SUBSCRIPTION" -g "$ACP_RG" -n "$ACP_WORKER"
            fi
            for i in $(seq 1 24); do
              ST=$(az containerapp show --subscription "$ACP_SUBSCRIPTION" \
                -g "$ACP_RG" -n "$ACP_WORKER" --query properties.runningStatus -o tsv 2>/dev/null || echo Unknown)
              [ "$ST" = "Running" ] && break
              sleep 5
            done
            [ "$ST" = "Running" ] || { echo "ERROR: $ACP_WORKER did not reach Running"; exit 1; }
          done
