# Staging-only capacity-policy exercise. It never enables the production gateway and restores
# each role worker's COMPLETE scale block, including every cron/queue/CPU rule and auth reference.
name: validate-staging-scale-test

on:
  workflow_dispatch:
    inputs:
      confirm_scale_test:
        description: "Temporarily change all three staging worker floors, then restore them"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  prerequisites:
    if: vars.STAGING_FQDN != '' && inputs.confirm_scale_test
    runs-on: ubuntu-latest
    environment:
      name: staging
    outputs:
      resource_group: ${{ steps.names.outputs.resource_group }}
    env:
      ACP_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      STAGING_RG: ${{ vars.STAGING_RG || 'mdk-accessibility' }}
      STAGING_APP: ${{ vars.STAGING_APP || 'acp-app-staging' }}
      STAGING_DISCOVERY_WORKER: ${{ vars.STAGING_DISCOVERY_WORKER || 'acp-discovery-staging' }}
      STAGING_ASSESS_WORKER: ${{ vars.STAGING_ASSESS_WORKER || 'acp-assess-staging' }}
      STAGING_REMEDIATE_WORKER: ${{ vars.STAGING_REMEDIATE_WORKER || 'acp-remediate-staging' }}
      ACP_ACA_VCPU_QUOTA: ${{ vars.STAGING_ACA_VCPU_QUOTA }}
      ACP_PG_MAX_CONNECTIONS: ${{ vars.STAGING_PG_MAX_CONNECTIONS }}
      ACP_PG_RESERVED_CONNECTIONS: ${{ vars.STAGING_PG_RESERVED_CONNECTIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse non-staging targets and missing capacity ceilings
        id: names
        run: |
          set -euo pipefail
          for APP in "$STAGING_APP" "$STAGING_DISCOVERY_WORKER" "$STAGING_ASSESS_WORKER" "$STAGING_REMEDIATE_WORKER"; do
            python3 scripts/validate_staging_azure.py --check-staging-only \
              --az-resource-group "$STAGING_RG" --az-app "$APP"
          done
          test -n "$ACP_ACA_VCPU_QUOTA" || { echo "::error::STAGING_ACA_VCPU_QUOTA is required"; exit 1; }
          test -n "$ACP_PG_MAX_CONNECTIONS" || { echo "::error::STAGING_PG_MAX_CONNECTIONS is required"; exit 1; }
          test -n "$ACP_PG_RESERVED_CONNECTIONS" || { echo "::error::STAGING_PG_RESERVED_CONNECTIONS is required"; exit 1; }
          python3 - <<'PY'
          import os
          quota = float(os.environ["ACP_ACA_VCPU_QUOTA"])
          maximum = int(os.environ["ACP_PG_MAX_CONNECTIONS"])
          reserve = int(os.environ["ACP_PG_RESERVED_CONNECTIONS"])
          assert quota > 0
          assert maximum > reserve >= 0
          PY
          echo "resource_group=$STAGING_RG" >> "$GITHUB_OUTPUT"
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify staging API managed-identity RBAC
        run: |
          set -euo pipefail
          PRINCIPAL=$(az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" \
            -n "$STAGING_APP" --query identity.principalId -o tsv)
          test -n "$PRINCIPAL" || { echo "::error::staging API has no system-assigned managed identity"; exit 1; }
          for APP in "$STAGING_DISCOVERY_WORKER" "$STAGING_ASSESS_WORKER" "$STAGING_REMEDIATE_WORKER"; do
            SCOPE=$(az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" -n "$APP" --query id -o tsv)
            COUNT=$(az role assignment list --assignee "$PRINCIPAL" --scope "$SCOPE" --include-inherited \
              --query "[?roleDefinitionName=='Contributor' || roleDefinitionName=='Container Apps Contributor'] | length(@)" -o tsv)
            test "$COUNT" -gt 0 || { echo "::error::staging API identity lacks write RBAC on $APP"; exit 1; }
          done

  scale-policy-test:
    needs: prerequisites
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      fail-fast: false
      matrix:
        app:
          - ${{ vars.STAGING_DISCOVERY_WORKER || 'acp-discovery-staging' }}
          - ${{ vars.STAGING_ASSESS_WORKER || 'acp-assess-staging' }}
          - ${{ vars.STAGING_REMEDIATE_WORKER || 'acp-remediate-staging' }}
    env:
      ACP_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      STAGING_RG: ${{ needs.prerequisites.outputs.resource_group }}
      STAGING_WORKER: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Snapshot complete scale policy and adapter prerequisites
        id: before
        run: |
          set -euo pipefail
          python3 scripts/validate_staging_azure.py --check-staging-only \
            --az-resource-group "$STAGING_RG" --az-app "$STAGING_WORKER"
          az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" -n "$STAGING_WORKER" \
            --query properties.template.scale -o json > original-scale.json
          python3 -m json.tool original-scale.json > /dev/null
          MIN=$(python3 -c 'import json; print(json.load(open("original-scale.json")).get("minReplicas",0))')
          MAX=$(python3 -c 'import json; print(json.load(open("original-scale.json")).get("maxReplicas",0))')
          test "$MIN" -lt "$MAX" || { echo "::error::$STAGING_WORKER has no scale headroom ($MIN-$MAX)"; exit 1; }
          if [ "$STAGING_WORKER" != *discovery* ]; then
            az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" -n "$STAGING_WORKER" \
              --query "contains(properties.configuration.secrets[].name, 'database-url')" -o tsv | grep -qi true
          fi
          echo "original_min=$MIN" >> "$GITHUB_OUTPUT"
          echo "new_min=$((MIN + 1))" >> "$GITHUB_OUTPUT"
      - name: Raise floor and prove all rules survive
        run: |
          set -euo pipefail
          az containerapp update --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" \
            -n "$STAGING_WORKER" --min-replicas "${{ steps.before.outputs.new_min }}" -o none
          OBSERVED=$(az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" \
            -n "$STAGING_WORKER" --query properties.template.scale.minReplicas -o tsv)
          test "$OBSERVED" = "${{ steps.before.outputs.new_min }}"
          az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" -n "$STAGING_WORKER" \
            --query properties.template.scale.rules -o json > observed-rules.json
          python3 - <<'PY'
          import json
          before = json.load(open("original-scale.json")).get("rules") or []
          after = json.load(open("observed-rules.json")) or []
          assert before == after, "Azure changed the existing rule array during a min-only update"
          PY
      - name: Restore the complete original scale block
        if: always() && steps.before.outputs.original_min != ''
        run: |
          set -euo pipefail
          APP_ID=$(az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" \
            -n "$STAGING_WORKER" --query id -o tsv)
          python3 - <<'PY'
          import json
          body = {"properties": {"template": {"scale": json.load(open("original-scale.json"))}}}
          json.dump(body, open("restore-body.json", "w"))
          PY
          az rest --method patch --uri "https://management.azure.com${APP_ID}?api-version=2024-03-01" \
            --headers Content-Type=application/json --body @restore-body.json -o none
          for _ in $(seq 1 30); do
            az containerapp show --subscription "$ACP_SUBSCRIPTION" -g "$STAGING_RG" -n "$STAGING_WORKER" \
              --query properties.template.scale -o json > restored-scale.json
            if python3 - <<'PY'
          import json, sys
          before = json.load(open("original-scale.json"))
          after = json.load(open("restored-scale.json"))
          sys.exit(0 if before == after else 1)
          PY
            then exit 0; fi
            sleep 10
          done
          echo "::error::complete scale block was not restored for $STAGING_WORKER"
          exit 1
      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-scale-${{ matrix.app }}
          path: |
            original-scale.json
            observed-rules.json
            restored-scale.json
          retention-days: 7
          if-no-files-found: ignore
