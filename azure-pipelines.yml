# ACP CI — the gate between "committed" and "trusted".
# Runs the full backend suite (incl. the auth route-coverage guard that fails
# the build if a new router ships unauthenticated) and proves the frontend
# builds. Kept runnable-on-demand; auto-triggering is OFF (see below).
#
# ── Auto-triggers retired 2026-08-10 ─────────────────────────────────────────────────────
# This file is a byte-for-byte mirror of .github/workflows/ci.yml — same Office-engine build,
# tesseract, backend suite, the three matrix guards, and both frontend builds — and GitHub
# Actions runs all of it on every PR and push, fast and reliably. The Azure org has ONE parallel
# job (#183), and two pipelines fed by this file (acp-ci-github and jeremyyuAWS.acp) both ran on
# every PR/push, serialising through that single slot: runs sat in `notStarted` for ~50 minutes
# and every PR read UNSTABLE on two checks that gate nothing (main is not branch-protected). No
# coverage is lost by silencing them — ci.yml already is the gate.
#
# `trigger: none` / `pr: none` (NOT deleting the blocks — an ABSENT trigger defaults to CI on
# every branch, which is the opposite of retiring it). The pipeline can still be run manually
# from the Azure DevOps UI. To fully stop it, also disable/delete the acp-ci-github and
# jeremyyuAWS.acp pipelines in Azure DevOps — this YAML cannot, and a UI "override the YAML
# trigger" toggle would defeat these two lines. To bring auto-CI back, restore the
# `branches: include: [main]` blocks this replaced.
trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

# ── Switching to the self-hosted agent ───────────────────────────────────────────────────
# Replace the two lines above with:
#
#   pool:
#     name: acp-local
#
# deploy/agent/ builds an agent that runs this file; deploy/agent/README.md has the pool and
# token steps. Do BOTH before flipping this, in this order — a `name:` naming a pool with no
# online agent does not fail fast, it leaves every queued run sitting in `notStarted` until
# someone notices, and CI looks slow rather than broken.
#
# Left commented rather than parameterised on purpose. `pool.name` does accept a runtime
# variable, but then the pool this repo gates on becomes a setting in the Azure DevOps UI —
# invisible in review, changeable without a commit, and not something `git log` can answer.
# For the one line that decides where the gate runs, two lines of diff is the better trade.
#
# Keep the hosted pool reachable in history: the agent is one laptop, and the honest fallback
# when it is off or away is to put these two lines back.

# Office engine: BUILT AND EXERCISED HERE (was a known gap until ADR 0012).
# The old note said AcpScan.Cli.csproj referenced DigitalA11y.* from the sibling
# _review-digital-accessibility checkout, so CI agents could never have it. ADR 0012
# vendored those projects into engine/office-analysers/ and repointed the csproj, so
# the CLI now builds standalone from a fresh clone — verified by building this repo
# with no sibling checkout present. The comment outlived the constraint by ~3 weeks
# and cost every CI run the engine-gated suites.
#
# REMAINING GAP — the PDF analyser (worker-python) is still NOT vendored. It is loaded
# at runtime from ACP_PDF_ENGINE (api/scanner.py:WP) and lives outside this repo, so:
#   * tests/test_scan.py still skips here — it scans the whole oracle corpus in one
#     pass, PDFs included, and scanner._analyse_pdf imports the analyser OUTSIDE its
#     try/except, so a missing PDF engine is a hard ModuleNotFoundError, not a
#     degraded scan;
#   * tests/test_remediation_capability.py::test_pdf_auto_entries_clear likewise.
# Both now say exactly that in their skip reason. Vendoring worker-python the way
# ADR 0012 vendored the Office analysers is what closes this.
steps:
  # The matrix guards below read commit bodies and diff against the target branch, so they
  # need real history — the default shallow fetch would make both silently useless.
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: Python 3.12

  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: '10.0.x'
    displayName: .NET 10 SDK (Office analyser engine)

  - script: dotnet build spike/dotnet/AcpScan.Cli/AcpScan.Cli.csproj -c Release --nologo
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    displayName: Build the Office analyser CLI
    # Produces spike/dotnet/AcpScan.Cli/bin/Release/net10.0/AcpScan.Cli.dll — the exact
    # path the tests' capability gates probe. bin/ stays gitignored; this is built, not
    # committed.

  - script: bash scripts/install_tesseract.sh
    displayName: Install tesseract (OCR)
    # Shares ci.yml's install script, which is the point of it being a script. This step was
    # the ONLY remaining copy of the unhardened `apt-get update -qq && apt-get install -qq`:
    # no timeout, no retry, no fallback mirror. That is the exact form that stalled for up to
    # an hour on 2026-08-18 and that failed half of all runners on 2026-08-19 — so the pipeline
    # least likely to be watched was carrying the most fragile version of the dependency.
    #
    # Kept in step with ci.yml, and this is the pipeline that proved why. The corpus
    # regression gate landed with tesseract added to ci.yml only; THIS pipeline runs the same
    # suite without it, ocr.is_available() went false, and 1.4.5 reported "found 0 of 1" —
    # a red build describing an environment gap as a product regression.
    #
    # Two CI pipelines running one suite need the same dependencies or the suite means
    # different things in each. The gate degrades honestly without OCR (see
    # tests/test_docx_corpus_regression_gate.py), but degrading is a fallback, not the plan:
    # 1.4.5 and 1.4.9 are only actually exercised where tesseract exists.

  - script: python -m pip install --quiet -r api/requirements.txt -r tests/requirements.txt
    displayName: Install API + test dependencies
    # tests/requirements.txt carries the OOXML authoring libs (python-docx/pptx/openpyxl)
    # that ~12 test modules use to build fixtures on the fly. They were undeclared and
    # only ever present ambiently on dev machines — harmless while the engine-gated tests
    # skipped here, load-bearing now that the engine is built.

  # -n auto --dist loadfile, mirroring ci.yml — see the long note there. loadfile is load-bearing
  # rather than a tuning choice: test_check_actually_fails_on_drift corrupts the real generated
  # scopePresets.js and restores it, so plain -n auto lets other workers read the corrupted
  # window and fail with a stale-file message that names the wrong cause.
  - script: python -m pytest tests/ -q -n auto --dist loadfile --junitxml=test-results.xml
    displayName: Backend suite (incl. auth-coverage guard)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFiles: test-results.xml
      testRunTitle: acp backend
    displayName: Publish test results

  # ── WCAG-matrix guards ────────────────────────────────────────────────────────────────
  # The matrix (jeremyyuAWS/wcag-matrix) mirrors this repo's capability claims. Both guards
  # run here, in the pipeline that actually gates main, rather than in the notification
  # workflow — a check that only runs after a merge cannot stop the drift it detects.

  # Every source a capability ceiling is derived from is parsed structurally. When one moves,
  # the generator raises rather than quietly producing a wrong ceiling — so running it IS the
  # check, and it fails here instead of in the matrix's PR job where nobody would see it.
  - script: python scripts/gen_matrix_coverage.py --check
    displayName: Matrix guard — capability ceiling still derivable

  # docs/TODO.md carries generated coverage facts alongside its authored backlog. Those facts
  # went 387 commits stale because nothing checked them, and the stalest part was the headline.
  # This is the thing that stops it recurring; it is cheap and it fails loudly.
  - script: python scripts/gen_todo_status.py --check
    displayName: Backlog guard — docs/TODO.md coverage block is current

  # Fails when a commit changed rule code without declaring its matrix impact. Add a
  # `Matrix-Note:` (+ `WCAG:`) trailer, or `Matrix-Note: none` to record a deliberate omission.
  # Merge commits are skipped by check() itself, explicitly and by parent count: a merge authors
  # nothing, and the commits it joins are single-parent and judged individually. Do not "simplify"
  # that back to relying on a merge's combined diff being empty — that only holds while the two
  # sides touch disjoint files, and #38 is what it looks like when they don't (see #32).
  - script: |
      set -euo pipefail
      if [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" ]; then
        target="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
        git fetch --quiet origin "${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
        python scripts/gen_progress_log.py --check --since "$target"
      else
        python scripts/gen_progress_log.py --check
      fi
    displayName: Matrix guard — rule changes declare their matrix impact

  # UseNode@1, not NodeTool@0. The first real run of this pipeline against the GitHub repo
  # (acp-ci-github #20260808.1) warned twice at Initialize job: "Task 'Node.js tool installer'
  # version 0 (NodeTool@0) is deprecated" and "will no longer receive updates. Please use
  # UseNodeV1 as a replacement."
  #
  # Same installer, same version, same result — a task-version bump, not a change of behaviour.
  # The input is renamed, though: NodeTool@0 took `versionSpec`, UseNode@1 takes `version`. Left
  # as `versionSpec` it would not fail loudly; the task would install whatever it defaults to,
  # which is the sort of green build that is quietly testing the wrong Node.
  #
  # Worth taking now rather than later: a deprecated task keeps working right up until it does
  # not, and this file has just become the gate that matters.
  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: Node 22 (pdfjs-dist requires >=22.13)

  - script: npm install -g npm@11 --no-audit --no-fund
    displayName: npm 11 (lockfile is npm-11 authored; npm 10 rejects its nested entries)

  - script: npm ci --no-audit --no-fund
    workingDirectory: frontend
    displayName: Install frontend dependencies

  - script: npx vitest run
    workingDirectory: frontend
    displayName: Frontend unit tests (rule round-trips + WCAG coverage contract)

  - script: npx vite build
    workingDirectory: frontend
    displayName: Frontend build
