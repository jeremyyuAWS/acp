# ACP CI — the gate between "committed" and "trusted".
# Runs the full backend suite (incl. the auth route-coverage guard that fails
# the build if a new router ships unauthenticated) and proves the frontend
# builds. Wire this as a build-validation branch policy on main so the
# PR-required policy gates on green CI rather than ceremony.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

# KNOWN GAP — office engine oracle tests (tests/test_scan.py, ~18 tests) skip on
# CI: AcpScan.Cli.csproj references DigitalA11y.* projects from the SIBLING
# _review-digital-accessibility checkout, which exists only on dev machines, and
# the built DLL is gitignored (prod ships the laptop-built artifact via the
# Docker context). Until the engine is vendored or published as a reproducible
# artifact, those tests are local-only and CI says so in the skip reason.
steps:
  # The matrix guards below read commit bodies and diff against the target branch, so they
  # need real history — the default shallow fetch would make both silently useless.
  - checkout: self
    fetchDepth: 0

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: Python 3.12

  - script: python -m pip install --quiet -r api/requirements.txt
    displayName: Install API dependencies

  - script: python -m pytest tests/ -q --junitxml=test-results.xml
    displayName: Backend suite (incl. auth-coverage guard)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFiles: test-results.xml
      testRunTitle: acp backend
    displayName: Publish test results

  # ── WCAG-matrix guards ────────────────────────────────────────────────────────────────
  # The matrix (jeremyyuAWS/wcag-matrix) mirrors this repo's capability claims. Both guards
  # run here, in the pipeline that actually gates main, rather than in the notification
  # workflow — a check that only runs after a merge cannot stop the drift it detects.

  # Every source a capability ceiling is derived from is parsed structurally. When one moves,
  # the generator raises rather than quietly producing a wrong ceiling — so running it IS the
  # check, and it fails here instead of in the matrix's PR job where nobody would see it.
  - script: python scripts/gen_matrix_coverage.py --check
    displayName: Matrix guard — capability ceiling still derivable

  # Fails when a commit changed rule code without declaring its matrix impact. Add a
  # `Matrix-Note:` (+ `WCAG:`) trailer, or `Matrix-Note: none` to record a deliberate omission.
  - script: |
      set -euo pipefail
      if [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" ]; then
        target="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
        git fetch --quiet origin "${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
        python scripts/gen_progress_log.py --check --since "$target"
      else
        python scripts/gen_progress_log.py --check
      fi
    displayName: Matrix guard — rule changes declare their matrix impact

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Node 22 (pdfjs-dist requires >=22.13)

  - script: npm install -g npm@11 --no-audit --no-fund
    displayName: npm 11 (lockfile is npm-11 authored; npm 10 rejects its nested entries)

  - script: npm ci --no-audit --no-fund
    workingDirectory: frontend
    displayName: Install frontend dependencies

  - script: npx vitest run
    workingDirectory: frontend
    displayName: Frontend unit tests (rule round-trips + WCAG coverage contract)

  - script: npx vite build
    workingDirectory: frontend
    displayName: Frontend build
