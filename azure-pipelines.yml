# Azure Repos CI. PR validation is enforced through an Azure branch build policy.
# The PDF engine is vendored in engine/pdf-analyser/ since ADR 0029.
name: $(Date:yyyyMMdd).$(Rev:r)
trigger:
  batch: false
  branches:
    include:
    - main
pr: none
pool:
  vmImage: ubuntu-latest
variables:
  CI: 'true'
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
jobs:
- job: backend
  displayName: Backend suite
  timeoutInMinutes: 60
  steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - task: Cache@2
    inputs:
      key: '"nuget" | "$(Agent.OS)" | **/*.csproj'
      path: $(NUGET_PACKAGES)
    displayName: Cache .NET (NuGet) packages
  - bash: dotnet build spike/dotnet/AcpScan.Cli/AcpScan.Cli.csproj -c Release --nologo
    displayName: Build the Office analyser CLI
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
  - bash: bash scripts/install_tesseract.sh
    displayName: Install tesseract (OCR)
    continueOnError: true
    name: tesseract
  - bash: python -m pip install --quiet -r api/requirements.txt -r tests/requirements.txt
    displayName: Install API + test dependencies
  # OCR installation above may continue so the test results remain available when apt fails.
  # The always-running engine guard still fails that shard if OCR could not load. veraPDF is
  # different: this step must succeed before the report suite can establish PDF/UA conformance.
  # Keep its installation independent of the OCR outcome, with no continuation on error here.
  # A missing PDF/UA validator must never produce a green conformance result by skipping checks.
  - bash: bash scripts/install_verapdf.sh
    displayName: Install veraPDF (PDF/UA-1 conformance gate)
  - bash: bash scripts/install_helm.sh
    displayName: Install helm (packaging chart render gate)
  - bash: python -m pytest tests/ -q -n auto --dist loadfile --splits 4 --group $(group) --junitxml=test-results-$(group).xml
    displayName: Backend suite (shard $(group)/4)
  - bash: python scripts/gen_matrix_coverage.py --check
    displayName: Matrix guard — capability ceiling still derivable
    condition: and(succeeded(), eq(variables['group'], '1'))
  - bash: python scripts/gen_queue_scalers.py --check
    displayName: Scaler guard — the queue scalers count claimable jobs
    condition: and(succeeded(), eq(variables['group'], '1'))
  - bash: python scripts/gen_todo_status.py --check
    displayName: Backlog guard — docs/TODO.md coverage block is current
    condition: and(succeeded(), eq(variables['group'], '1'))
  - bash: python scripts/gen_section_508_catalog.py --check
    displayName: Standards guard — the Section 508 catalog matches the regulation
    condition: and(succeeded(), eq(variables['group'], '1'))
  - bash: python scripts/gen_fixture_coverage.py --check
    displayName: Corpus guard — ground-truth fixture coverage has not regressed
    condition: and(succeeded(), eq(variables['group'], '1'))
  - bash: |
      set -euo pipefail
      if [ -n "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" ]; then
        target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
        git fetch --quiet origin "$target"
        python scripts/gen_progress_log.py --check --since "origin/$target"
      else
        python scripts/gen_progress_log.py --check
      fi
    displayName: Matrix guard — rule changes declare their matrix impact
    condition: and(succeeded(), eq(variables['group'], '1'))
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results-$(group).xml
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
    condition: always()
    displayName: Publish test results
  - bash: python scripts/check_engines.py --require office,pdf,ocr
    displayName: Fail if an analysis engine is missing
    condition: always()
  strategy:
    matrix:
      group1:
        group: '1'
      group2:
        group: '2'
      group3:
        group: '3'
      group4:
        group: '4'
- job: postgres
  displayName: Postgres integration (schema/lock regressions)
  timeoutInMinutes: 60
  steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
  - bash: python -m pip install --quiet -r api/requirements.txt -r tests/requirements.txt
    displayName: Install API + test dependencies
  - bash: |
      python -m pytest tests/test_schema_boot_locks.py tests/test_pg_job_queue.py \
        tests/test_pg_result_fencing.py tests/test_db_mutation_reserve.py \
        tests/test_pg_hitl_idempotency.py \
        -v --no-header -p no:warnings
    displayName: Schema, lock and job-queue regressions against a real PostgreSQL
    env:
      DATABASE_URL: postgresql://postgres:acp-ci-throwaway@localhost:5432/acp_ci
      ACP_REQUIRE_PG: '1'
      ACP_PG_TEST_DESTRUCTIVE: '1'
  - bash: |
      set -euo pipefail
      python -m pytest tests/test_schema_boot_locks.py tests/test_pg_job_queue.py \
        tests/test_pg_result_fencing.py tests/test_pg_hitl_idempotency.py \
        -q --no-header -p no:warnings > /tmp/pg.txt 2>&1 || { cat /tmp/pg.txt; exit 1; }
      cat /tmp/pg.txt
      if grep -qE '[0-9]+ skipped' /tmp/pg.txt; then
        echo "::error::tests skipped in the Postgres job — they did not exercise the server"
        exit 1
      fi
      grep -qE '[0-9]+ passed' /tmp/pg.txt || {
        echo "::error::no tests ran in the Postgres job"; exit 1; }
    displayName: Fail if anything in this job skipped instead of running
    env:
      DATABASE_URL: postgresql://postgres:acp-ci-throwaway@localhost:5432/acp_ci
      ACP_REQUIRE_PG: '1'
      ACP_PG_TEST_DESTRUCTIVE: '1'
  services:
    postgres: ci_postgres
- job: frontend
  displayName: Frontend tests + build
  timeoutInMinutes: 60
  steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
  - task: UseNode@1
    inputs:
      version: 22.x
  - bash: npm install -g npm@11 --no-audit --no-fund
    displayName: npm 11
  - bash: npm ci --no-audit --no-fund
    workingDirectory: frontend
    displayName: Install frontend dependencies
  - bash: npx vitest run
    workingDirectory: frontend
    displayName: Frontend unit tests (rule round-trips + WCAG coverage contract)
  - bash: npx vite build
    workingDirectory: frontend
    displayName: Frontend build
- job: e2e
  displayName: Playwright E2E (browser + local API)
  timeoutInMinutes: 60
  steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
  - task: UseNode@1
    inputs:
      version: 22.x
  - bash: npm install -g npm@11 --no-audit --no-fund
    displayName: npm 11
  - bash: npm ci --no-audit --no-fund
    workingDirectory: frontend
    displayName: Install frontend dependencies
  - bash: npx playwright install --with-deps chromium
    workingDirectory: frontend
    displayName: Install browser
  - bash: |
      python -m venv .venv-e2e
      .venv-e2e/bin/pip install --quiet -r api/requirements.txt
    displayName: Install API dependencies
  # Preserve the GitHub browser suite's advisory status without making all CI partially succeeded.
  - bash: |
      if ! npx playwright test; then
        echo "##vso[task.logissue type=warning]Playwright reported failures; inspect the browser artifacts."
      fi
    workingDirectory: frontend
    displayName: Playwright E2E
  - bash: mkdir -p frontend/test-results frontend/playwright-report
    condition: always()
    displayName: Prepare browser artifacts
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: frontend/test-results
      artifact: playwright-results
    condition: always()
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: frontend/playwright-report
      artifact: playwright-report
    condition: always()
resources:
  containers:
  - container: ci_postgres
    image: postgres:16
    env:
      POSTGRES_PASSWORD: acp-ci-throwaway
      POSTGRES_DB: acp_ci
    ports:
    - 5432:5432
    options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
