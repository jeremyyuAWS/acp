<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#46303F" />
    <title>mova.io — accessibility compliance</title>
    <meta name="description" content="Connect your content stores, inventory every document, and score it against WCAG 2.1 AA — with an audit trail you can prove." />
    <meta property="og:title" content="mova.io — accessibility compliance" />
    <meta property="og:description" content="Inventory, assess, remediate, and prove WCAG 2.1 compliance across your content stores." />
    <meta property="og:type" content="website" />
    <!-- Google Identity Services: per-user "Sign in with Google" (no-op until a Web client id is configured) -->
    <script src="https://accounts.google.com/gsi/client" async></script>
    <!-- Microsoft Authentication Library: SharePoint / OneDrive (no-op until an Entra client id is configured).
         MSAL v3 (the API SignIn.jsx calls initialize() against) is not published on Microsoft's own
         alcdn.msauth.net CDN — that host stops at v2.38.1, so the old 3.26.1 URL 404'd and window.msal
         never loaded ("Microsoft sign-in isn't ready yet"). Pinned to the v3 UMD on jsDelivr with an SRI
         hash so the bytes are verified — matters for a PHI deployment loading third-party auth JS. -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.26.1/lib/msal-browser.min.js"
            integrity="sha384-STM1Hk2mbwBYX0WbMxgsFcNYum774lsKA4Ws1Rt9LssDv/pv04vGW9RK8CXfEJSW"
            crossorigin="anonymous" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
