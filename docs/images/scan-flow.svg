<svg width="100%" viewBox="0 0 680 690" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>ACP scan flow</title>
<desc>A document scan moves through connect, discover and read, analyze across three engines, record every check, score, and persist. Findings that need judgment are routed to a human review queue, and every decision is written to an audit log.</desc>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888780"/></marker></defs>
<rect x="1" y="1" width="678" height="688" rx="14" fill="#FFFFFF" stroke="#E8E8E3"/>

<rect x="220" y="42" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD"/>
<text x="240" y="53" font-size="12" fill="#5F5E5A">automated · deterministic</text>
<rect x="430" y="42" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517"/>
<text x="450" y="53" font-size="12" fill="#5F5E5A">human review · audit</text>

<rect x="200" y="74" width="280" height="48" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Connect a source</text>
<text x="340" y="111" text-anchor="middle" font-size="12" fill="#185FA5">Drive · SharePoint · read-only</text>
<line x1="340" y1="122" x2="340" y2="144" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="200" y="146" width="280" height="48" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Discover &amp; read</text>
<text x="340" y="183" text-anchor="middle" font-size="12" fill="#185FA5">list files · ephemeral copies</text>
<line x1="340" y1="194" x2="340" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="200" y="218" width="280" height="48" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Analyze</text>
<text x="340" y="255" text-anchor="middle" font-size="12" fill="#185FA5">routed by file type</text>

<line x1="340" y1="266" x2="340" y2="284" stroke="#888780" stroke-width="1.5"/>
<line x1="170" y1="284" x2="510" y2="284" stroke="#888780" stroke-width="1.5"/>
<line x1="170" y1="284" x2="170" y2="296" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="340" y1="284" x2="340" y2="296" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="510" y1="284" x2="510" y2="296" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="95" y="298" width="150" height="40" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="170" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">HTML · JS</text>
<rect x="265" y="298" width="150" height="40" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Office · .NET</text>
<rect x="435" y="298" width="150" height="40" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="510" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">PDF · Python</text>

<line x1="170" y1="338" x2="170" y2="352" stroke="#888780" stroke-width="1.5"/>
<line x1="510" y1="338" x2="510" y2="352" stroke="#888780" stroke-width="1.5"/>
<line x1="340" y1="338" x2="340" y2="352" stroke="#888780" stroke-width="1.5"/>
<line x1="170" y1="352" x2="510" y2="352" stroke="#888780" stroke-width="1.5"/>
<line x1="340" y1="352" x2="340" y2="366" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="200" y="368" width="280" height="48" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Record every check</text>
<text x="340" y="405" text-anchor="middle" font-size="12" fill="#185FA5">pass · fail · error · n/a</text>
<text x="500" y="397" font-size="12" fill="#5F5E5A">&#8594; Postgres + Langfuse</text>
<line x1="340" y1="416" x2="340" y2="438" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="200" y="440" width="280" height="48" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="460" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Score</text>
<text x="340" y="477" text-anchor="middle" font-size="12" fill="#185FA5">rubric &#8594; 0–100</text>
<line x1="340" y1="488" x2="340" y2="510" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="200" y="512" width="280" height="48" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="340" y="532" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Persist &amp; clean up</text>
<text x="340" y="549" text-anchor="middle" font-size="12" fill="#185FA5">immutable event · copies deleted</text>

<line x1="480" y1="536" x2="500" y2="536" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="502" y="514" width="128" height="44" rx="9" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="566" y="533" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Audit log</text>
<text x="566" y="549" text-anchor="middle" font-size="11" fill="#854F0B">every decision</text>

<line x1="340" y1="560" x2="340" y2="582" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="200" y="584" width="280" height="48" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="340" y="604" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Human review queue</text>
<text x="340" y="621" text-anchor="middle" font-size="12" fill="#854F0B">judgment calls routed here</text>

<text x="340" y="656" text-anchor="middle" font-size="12" fill="#5F5E5A">Deterministic mode routes every AI-assisted finding here.</text>
</svg>
