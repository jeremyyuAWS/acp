<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>ACP deployment topology</title>
<desc>ACP runs as four services — the app, Grafana, Langfuse, and Postgres — either on Azure Container Apps or entirely inside a customer's own cloud via docker compose.</desc>
<rect x="1" y="1" width="678" height="438" rx="14" fill="#FFFFFF" stroke="#E8E8E3"/>
<text x="340" y="46" text-anchor="middle" font-size="13" fill="#5F5E5A">Deploy to Azure — or run the whole stack in your own cloud.</text>

<rect x="44" y="68" width="284" height="316" rx="12" fill="#F4F9FE" stroke="#185FA5" stroke-width="1.5"/>
<text x="60" y="90" font-size="13" font-weight="600" fill="#0C447C">Azure Container Apps</text>
<text x="60" y="106" font-size="11" fill="#185FA5">region eastus2</text>
<rect x="62" y="118" width="248" height="48" rx="9" fill="#E6F1FB" stroke="#378ADD"/>
<text x="78" y="140" font-size="14" font-weight="600" fill="#0C447C">acp-app</text>
<text x="78" y="156" font-size="11" fill="#185FA5">FastAPI + SPA + engines</text>
<rect x="62" y="174" width="248" height="48" rx="9" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="78" y="196" font-size="14" font-weight="600" fill="#085041">acp-grafana</text>
<text x="78" y="212" font-size="11" fill="#0F6E56">dashboards</text>
<rect x="62" y="230" width="248" height="48" rx="9" fill="#EEEDFE" stroke="#534AB7"/>
<text x="78" y="252" font-size="14" font-weight="600" fill="#3C3489">acp-langfuse</text>
<text x="78" y="268" font-size="11" fill="#534AB7">tracing</text>
<rect x="62" y="286" width="248" height="48" rx="9" fill="#F1EFE8" stroke="#888780"/>
<text x="78" y="308" font-size="14" font-weight="600" fill="#2C2C2A">Postgres flexible server</text>
<text x="78" y="324" font-size="11" fill="#5F5E5A">acpdb + langfusedb</text>

<rect x="352" y="68" width="284" height="316" rx="12" fill="#F7F5EF" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="368" y="90" font-size="13" font-weight="600" fill="#2C2C2A">Customer VPC</text>
<text x="368" y="106" font-size="11" fill="#5F5E5A" font-family="ui-monospace, monospace">docker compose up</text>
<rect x="370" y="118" width="248" height="48" rx="9" fill="#F1EFE8" stroke="#888780"/>
<text x="386" y="140" font-size="14" font-weight="600" fill="#2C2C2A">db — Postgres</text>
<text x="386" y="156" font-size="11" fill="#5F5E5A">acpdb + langfusedb</text>
<rect x="370" y="174" width="248" height="48" rx="9" fill="#E6F1FB" stroke="#378ADD"/>
<text x="386" y="196" font-size="14" font-weight="600" fill="#0C447C">acp-app</text>
<text x="386" y="212" font-size="11" fill="#185FA5">port 8077</text>
<rect x="370" y="230" width="248" height="48" rx="9" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="386" y="252" font-size="14" font-weight="600" fill="#085041">grafana</text>
<text x="386" y="268" font-size="11" fill="#0F6E56">port 3000</text>
<rect x="370" y="286" width="248" height="48" rx="9" fill="#EEEDFE" stroke="#534AB7"/>
<text x="386" y="308" font-size="14" font-weight="600" fill="#3C3489">langfuse</text>
<text x="386" y="324" font-size="11" fill="#534AB7">port 3001</text>

<text x="340" y="412" text-anchor="middle" font-size="11" fill="#5F5E5A">Same images. Zero external dependencies.</text>
</svg>
