# Defaults for the ACP application chart.
#
# THESE ARE NOT A DEPLOYMENT. Every real install renders its values from an acp-deployment
# document (`acpctl values <doc> > values.yaml`), because that document is the reviewed record of
# what was installed and this file is not. What lives here is the shape — every key the templates
# read, with a default that is either safe or absent — so that `helm template` on the bare chart
# produces something legible and `helm lint` has a complete schema to check.
#
# Where a default would be a GUESS about somebody's infrastructure, there is no default: the
# template fails the render and says which key is missing. A chart that invents a database
# hostname installs an application that cannot start, and reports success doing it.

acpDeployment:
  name: acp
  environment: development
  profile: standard
  platform: kubernetes
  adapter: ""
  supportStatus: planned

image:
  registry: ""
  repository: acp
  # Worker and API share one image; they differ by command and by ACP_WORKER_ROLE.
  workerRepository: acp-worker
  # A separate artifact, not a tag on the application image: deploy/ollama/Dockerfile bakes the
  # models into the layer, so this image is multi-GB and rebuilt on a different cadence.
  ollamaRepository: acp-ollama-gateway
  # Also a first-party artifact, not stock Grafana: deploy/grafana/Dockerfile bakes ACP's
  # dashboards, alert rules and datasource provisioning into it.
  grafanaRepository: acp-grafana
  tag: ""
  # Digests, when `acpctl install` has resolved them. A digest wins over the tag, because a tag
  # is a moving reference and an install that cannot say exactly what it ran is not auditable.
  digests: {}
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

api:
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    scaler: hpa
    triggers: []
  resources: {}
  env: {}
  port: 8077
  service:
    type: ClusterIP
    port: 80

# The command every worker container runs, unless a role overrides it with `command`.
#
# NOT A TUNING KNOB — without it a worker pod runs the API. The application image's CMD starts
# uvicorn, so a worker Deployment that inherits it serves HTTP, reports Ready and claims no jobs,
# with no error anywhere. `acp-worker` is the image's worker entrypoint (deploy/public/
# worker-entry.sh, which execs `python -m worker_main`). Override per role only for a worker
# image whose entrypoint differs.
workerCommand:
  - acp-worker

# How long Kubernetes waits before SIGKILL on a worker pod, and how long the worker keeps draining
# inside that window. ONE DECISION WRITTEN AS TWO NUMBERS, so they are derived from each other:
# leave `workerDrainSeconds` empty and it is the grace period minus the headroom. Setting the grace
# period alone used to leave the worker draining for api/core.py's default of 20 seconds and idling
# for the rest, which is the failure this pairing exists to prevent.
#
# The headroom is what a worker needs to finish its current write and exit AFTER it stops claiming
# new work. 60s is production's own figure — deploy/public/redeploy.sh pairs 540 with a 600-second
# grace — not a round number chosen here.
workerTerminationGracePeriodSeconds: 300
workerDrainHeadroomSeconds: 60
workerDrainSeconds: ""

# One entry per worker role. The keys are the role names the application understands
# (ACP_WORKER_ROLE), and adding a key here adds a Deployment — there is no per-role template.
workers: {}

ingress:
  enabled: false
  className: ""
  host: ""
  tls: false
  tlsSecretName: ""
  annotations: {}

networkPolicy:
  # WHO MAY REACH THE API. Empty means the chart decides: with a public ingress the controller is
  # in a namespace this chart cannot name, so the rule stays open; without one it is restricted to
  # the release's own pods. Set this to name peers explicitly — a list of NetworkPolicy `from`
  # entries — when a controller, a scraper or another workload must reach the API and is not part
  # of this release.
  apiIngressFrom: []
  enabled: false
  defaultDeny: false
  workerIngress: true
  allowedEgress: []
  # What default-deny lets back out. NOT A HARDENING KNOB — with `defaultDeny` on and this list
  # empty, no ACP pod can resolve a hostname or reach its own database, and the installation does
  # not start. NetworkPolicy matches on IP and never on hostname, so ports are the enforceable
  # half; `allowedEgress` records the intended destinations for a FQDN-aware policy engine to act
  # on. Edit this when a data service listens somewhere else.
  egressPorts:
    - {port: 53, protocol: UDP}       # DNS. Without it nothing resolves, including Postgres.
    - {port: 53, protocol: TCP}
    - {port: 443, protocol: TCP}      # Object storage, OAuth, external AI, telemetry.
    - {port: 5432, protocol: TCP}     # PostgreSQL.
    - {port: 6379, protocol: TCP}     # Redis/Valkey.
    - {port: 6380, protocol: TCP}     # Redis over TLS — Azure Managed Redis' default port.

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Data services. `enabled: true` means IN-CLUSTER, which this chart does not provision — see
# Chart.yaml. `external: true` means the adapter supplies the endpoint, which is the supported
# path, and the connection details arrive through `secrets.refs`.
postgresql:
  mode: managed
  enabled: false
  external: true
  chart: null
redis:
  mode: managed
  enabled: false
  external: true
  chart: null
objectStorage:
  mode: managed
  enabled: false
  external: true
  chart: null
  # The storage account holding remediated output. NO DEFAULT ON PURPOSE, and the consequence of
  # leaving it empty is worth stating: `api/blob.py` is the primary store for a remediated file's
  # fixed copy and is a no-op without it, so the installation produces corrected documents and
  # drops them — recording the digest and the length, never the bytes. `acpctl values` fills this
  # from the deployment document's `data.objectStorage.account`, and `acpctl validate` warns when
  # the document omits it. A guess here would be a storage account somebody else owns.
  account: ""

secrets:
  provider: kubernetes
  # When the platform's secret backend is not Kubernetes itself, the External Secrets Operator
  # syncs the references into one Secret and the workloads mount that. The workloads cannot tell
  # the difference, which is the point.
  externalSecrets:
    enabled: false
    backend: ""
    secretStoreRef: ""
    refreshInterval: 1h
  # Name of an existing Secret to consume instead of the one this chart wires up. For the case
  # where a cluster's secrets are managed by something this chart has never heard of.
  existingSecret: ""
  refs: {}

ai:
  mode: local-only
  ollama:
    enabled: false
    gpu: false
    # How many GPUs the ollama container requests when `gpu` is true. One is what a single
    # model-serving pod uses; more only helps a runtime configured to shard across devices.
    gpuCount: 1
    port: 11434
    # NO modelVolume. deploy/ollama/Dockerfile bakes llama3.1:8b and moondream into the image and
    # serves them from /models specifically so a mounted volume cannot shadow them — see the
    # comment at the top of templates/ollama.yaml. The document still accepts `ai.ollama.
    # modelVolume` for a deployment that supplies its own runtime; this chart does not act on it.
    resources: {}
    nodeSelector: {}
    tolerations: []
    # Extra env for the ollama container, and for the workloads that CALL it.
    env: {}
    clientEnv: {}
  externalProviders: []

observability:
  openTelemetry:
    enabled: false
    exporter: ""
    endpoint: ""
  grafana:
    enabled: false
    port: 3000
    # The image runs as UID 472 and owns its data directory as 472. Named rather than inherited
    # from podSecurityContext (10001), which would leave Grafana unable to write its own state.
    uid: 472
    # Grafana builds absolute links from this; left empty the stock image derives them from the
    # request, which is right behind an ordinary Ingress and wrong behind a path-rewriting one.
    rootUrl: ""
    resources: {}
    env: {}
  langfuse:
    mode: disabled
    # The endpoint traces are written to. NO DEFAULT: `api/lf.py` enables tracing only with the
    # host and both keys, and a guessed host would send an installation's traces somewhere its
    # operator did not choose. `acpctl values` fills this from the document's
    # `observability.langfuse.host`, which `acpctl validate` requires whenever a mode is set.
    host: ""

# Database backup, as a CronJob, and the restore Job that makes it worth having. OFF BY DEFAULT,
# and `schedule` and `retentionDays` have NO DEFAULTS AT ALL: between them they are this
# installation's recovery point objective and its retention policy, and a chart that picked
# `"0 2 * * *"` and `7` would be choosing both on the operator's behalf and recording that choice
# nowhere anyone would read it. Enabling backup without either fails the render naming the key.
#
# NOT YET DECLARABLE IN A DEPLOYMENT DOCUMENT, and that is deliberate rather than pending.
# `acpctl values` does not emit this block, so a values file regenerated from a document loses it
# — set it in an overlay, or with --set, until the contract carries it. Adding it to the document
# means the document choosing a backup STRATEGY, and for `data.postgres.mode: managed` — every
# production example in packaging/examples/ — the provider's own point-in-time recovery already
# covers this ground. Whether a second, in-cluster logical copy belongs beside it is an owner
# decision (PRD S16 RTO/RPO), not one to settle by shipping a schema field.
#
# See templates/backup-cronjob.yaml for what this does and does not back up: Postgres only, onto a
# volume in the same cluster, which covers accidental deletion and a bad migration and does not
# cover the cluster loss PRD S16 also names.
backup:
  enabled: false
  # A cron expression in the CLUSTER's timezone. This is the RPO — no default.
  schedule: ""
  # Days of dumps to keep. Match `data.postgres.backupRetentionDays` in the deployment document,
  # so the job that deletes them and the document that promises them cannot disagree. No default.
  retentionDays: null
  image:
    registry: ""
    repository: postgres
    # AT LEAST THE MAJOR VERSION OF THE SERVER. pg_dump refuses to dump a newer server than
    # itself, so this is a value rather than a constant. 16 is what the reference cluster runs.
    tag: "16"
    digest: ""
    pullPolicy: IfNotPresent
  # Where the dumps land inside the container, and the volume they land on. The claim is created
  # by this chart with `helm.sh/resource-policy: keep`, so `helm uninstall` leaves the backups
  # behind rather than deleting them at the exact moment somebody wants them.
  mountPath: /backups
  storage:
    # Point this at a claim backed by storage that outlives the cluster, and the recovery story
    # stops ending at the cluster boundary. Set, nothing below is used and no claim is created.
    existingClaim: ""
    # Sized for retentionDays × the compressed dump, with room for the one being written. A
    # default rather than a refusal because a volume that is too small fails loudly and
    # immediately, which is not the class of mistake the missing defaults above guard against.
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  # One retry, because the ordinary cause of a failed backup is a database that was briefly
  # unreachable, and a missed window costs more than a second attempt.
  backoffLimit: 1
  # A missed window (controller outage, cordoned node) still runs, up to six hours late. A late
  # backup is worth strictly more than no backup.
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# The restore, run deliberately and never as part of a deploy. See templates/restore-job.yaml for
# the supported invocation — it renders this one object with `helm template -s` and applies it,
# rather than being a hook on `helm upgrade`, which is the one command whose job is to bring the
# application back up while a restore needs it down.
restore:
  enabled: false
  # Which dump, by filename on the backup volume. No "latest": after a bad migration the newest
  # backup is the one you do not want.
  file: ""
  # Names the Job. A new restore needs a new id, so a values file left with `enabled: true`
  # re-applies an identical completed Job on the next upgrade instead of restoring again.
  runId: ""
  # Must equal this release's full name. The accident worth refusing is a production restore run
  # with a staging values file, and a yes/no token reads the same in both.
  confirm: ""

# Schema migrations run as a hook BEFORE the new code is admitted, with backoffLimit 0 — a failed
# migration must stop the release rather than retry against a database it has already half
# changed. See ADR 0045 for why every migration is additive and why there is no down-migration.
migrations:
  enabled: true
  hook: "pre-install,pre-upgrade"
  backoffLimit: 0

# Preflight runs AFTER, and reports. It is deliberately not a gate: a post-install check that
# fails the release would roll back a deployment whose application is already serving.
preflight:
  enabled: true
  hook: "post-install,post-upgrade"
  backoffLimit: 0

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  # THE FOURTH THING THE RESTRICTED POD SECURITY STANDARD REQUIRES, and the one this chart was
  # missing. runAsNonRoot, allowPrivilegeEscalation: false and capabilities.drop: [ALL] were all
  # here; without a seccomp profile the pods still fail admission in a namespace enforcing
  # `restricted`, so "restricted pod security where technically possible" (PRD S5.B) was a claim
  # about three quarters of a standard.
  #
  # RuntimeDefault is the container runtime's own profile, which is what `restricted` asks for;
  # `Unconfined` is what the absence of this field means, and it is what the standard exists to
  # refuse.
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  # TRUE SINCE THE RUBRIC WRITE MOVED TO THE DATABASE. It was false because `PUT /rubric` wrote
  # `config/rubric.active.json` into the image, which a read-only root turns into a 500; that
  # write is now a database setting, so the last application-side blocker is gone. Everything
  # else writes under `scratch.mountPath`, which is mounted below.
  #
  # Ollama and Grafana pin this back to false in their own templates, each with its reason: both
  # are third-party images that write outside /tmp, and neither runs on the reference cluster, so
  # a read-only claim for them could not be validated where the others are.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The single writable path. See `acp.scratchVolume` in templates/_helpers.tpl for why it has no
# sizeLimit and is not memory-backed.
scratch:
  mountPath: /tmp
nodeSelector: {}
tolerations: []
affinity: {}

# Zone spreading for tiers that run more than one pod. See the comment on `acp.topologySpread` in
# templates/_helpers.tpl for why `whenUnsatisfiable` defaults to the soft value and what it costs
# to harden: `DoNotSchedule` strands every replica on a cluster whose nodes carry no zone label,
# which includes the reference cluster and every single-zone install.
topologySpread:
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
