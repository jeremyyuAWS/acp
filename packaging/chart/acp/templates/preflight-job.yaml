{{- if .Values.preflight.enabled }}
{{/*
Post-install verification — a report, deliberately not a gate.

WHY IT DOES NOT BLOCK. A post-install hook that fails the release triggers a rollback of a
deployment whose application is already running and already serving requests. So a check that is
itself broken — a probe with the wrong URL, a dependency that is slow on first boot — takes down
a working install. The gate that matters ran BEFORE the new code was admitted: the migration
hook, which does block.

What this reports is what a human should read after an install: whether the API can reach its
database, its object storage and its renderer. `acpctl status` (phase 2) is the on-demand version
of the same question; this is the one that runs whether or not anybody remembers to ask.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "acp.fullname" . }}-preflight
  labels:
    {{- include "acp.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
  annotations:
    "helm.sh/hook": {{ .Values.preflight.hook | quote }}
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.preflight.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "acp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: preflight
    spec:
      restartPolicy: Never
      {{- /*
        NO serviceAccountName, AND THAT IS THE FIX FOR AN INSTALL THAT NEVER WORKED.

        Helm runs `pre-install` hooks BEFORE it creates the release's own resources. The chart's
        ServiceAccount is one of those resources, so a hook Job naming it referenced something
        that did not exist yet: the ServiceAccount admission plugin rejects the pod, the Job
        controller creates none, and the Job sits at 0/1 with NO POD AT ALL until Helm gives up —

          Error: INSTALLATION FAILED: failed pre-install: 1 error occurred:
                  * timed out waiting for the condition

        which is what the first run of the reference cluster produced on 2026-09-08, after ten
        minutes of saying nothing. `helm template` cannot show this: both objects render
        perfectly, and only the install has an ordering.

        So these Jobs run as `default`, which exists in every namespace from the moment it is
        created. NEITHER NEEDS MORE: the migration connects to Postgres with DATABASE_URL from a
        Secret, and preflight makes one HTTP request to the API. Neither touches the Kubernetes
        API, so the token is dropped too.

        WHAT THIS COSTS, so the next person does not have to rediscover it: the release's
        ServiceAccount is where an AKS, EKS or GKE adapter binds workload identity, and these
        hooks do not get it. A future hook that needs cloud credentials — a preflight that
        verifies object-storage access, say — cannot simply add the name back. It has to move the
        ServiceAccount into the pre-install phase (a `helm.sh/hook` annotation with a weight below
        this Job's), which takes the ServiceAccount out of the release manifest and leaves it
        behind on uninstall. That trade was not worth making for two hooks that need nothing.
      */}}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: preflight
          image: {{ include "acp.image" (dict "root" $ "component" "api") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- /*
            Reads the application's OWN readiness endpoint through the Service, rather than
            re-implementing the checks. /readyz already knows what ACP needs to serve — the
            database, the renderer, the queue — and a second list here would be a second opinion
            that drifts from the first. Read-only: it asks the running deployment a question.
          */}}
          command:
            - python
            - -c
            - |
              import json, sys, urllib.request
              url = "http://{{ include "acp.fullname" . }}-api:{{ .Values.api.service.port }}/readyz"
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      body = json.loads(r.read() or b"{}")
              except Exception as exc:
                  print(f"preflight: could not reach {url}: {exc}")
                  sys.exit(1)
              print(json.dumps(body, indent=2, sort_keys=True))
              print("preflight: readyz reachable")
          env:
            {{- include "acp.commonEnv" . | nindent 12 }}
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
{{- end }}
