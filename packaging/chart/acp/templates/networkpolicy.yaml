{{- if .Values.networkPolicy.enabled }}
{{/*
Network posture. Two objects, because "deny everything" and "allow what ACP needs" are separate
decisions and only the first is safe to get wrong in the tightening direction.

A NETWORKPOLICY IS A CLUSTER CAPABILITY, NOT A GUARANTEE THIS CHART MAKES. Kubernetes silently
ignores NetworkPolicy objects when the CNI does not implement them — no error, no event, no
status field saying "unenforced". Flannel is the common case. So a regulated installation can
render every policy below, pass every review, and be running with completely open pod networking.
`acpctl doctor` makes that check against a live cluster — by INFERENCE from the CNI, since
enforcement has no API to query, and it says so rather than implying certainty. It cannot be
checked here at all, and staying quiet about that would be the more dangerous choice.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "acp.fullname" . }}-default-deny
  labels:
    {{- include "acp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "acp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.defaultDeny }}
    - Egress
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "acp.fullname" . }}-api
  labels:
    {{- include "acp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "acp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
{{- if not .Values.networkPolicy.workerIngress }}
---
{{/*
`privateWorkers: true` in the deployment document. Workers claim from the queue and are reached by
nothing — so an empty `ingress:` list is the accurate policy, and it is deliberately empty rather
than absent: omitting the key entirely would leave the default-deny above as the only statement,
which is the same effect by accident instead of on purpose.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "acp.fullname" . }}-worker-no-ingress
  labels:
    {{- include "acp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "acp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
{{- if .Values.networkPolicy.defaultDeny }}
---
{{/*
What default-deny lets back out, and why this is NOT conditional on `allowedEgress`.

THE POLICY ABOVE DENIES ALL EGRESS. Adding `Egress` to a policyType with no egress rule denies
every outbound packet from every ACP pod — DNS included. Until 2026-09-08 this companion policy
rendered only `if allowedEgress` was non-empty, and even then opened only 53 and 443, so on any
cluster that ENFORCES policy:

  a document with no external sources  got no egress at all, not even DNS, and no pod resolved
                                       its own database hostname
  a document with external sources     got DNS and 443, and still could not reach Postgres on
                                       5432 or Redis on 6379

Either way the installation cannot start. It was invisible because no cluster anybody had tested
on enforces policy — and `acpctl doctor` treats a CNI that does NOT enforce as a BLOCKER, so the
chart required exactly the environment in which it could not run. kind's default CNI does not
enforce either, which is why the reference cluster cannot catch this and says so in its README.

WHAT THIS OPENS IS PORTS, NOT DESTINATIONS, and that limit is the same one the annotations below
have always stated. NetworkPolicy matches on IP, never on hostname: `allowedEgress:
[googleapis.com]` cannot become an `ipBlock` here, because the addresses behind that name change
and pinning today's would break the connector on a day nobody deployed anything. Real hostname
control needs a policy engine that understands names — Cilium's `toFQDNs`, or an egress proxy —
which is an adapter concern, and naming it is better than rendering an `ipBlock` that looks like
enforcement and is a snapshot of yesterday's DNS.

So the ports are the enforceable half and they are values-driven: an installation whose Postgres
listens somewhere else edits `networkPolicy.egressPorts` rather than discovering at rollout that
its database is unreachable.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "acp.fullname" . }}-egress
  labels:
    {{- include "acp.labels" . | nindent 4 }}
  annotations:
    acp.mova.io/intended-egress: {{ join "," .Values.networkPolicy.allowedEgress | quote }}
    acp.mova.io/egress-enforcement: >-
      hostname allow-listing is not expressible in NetworkPolicy; enforce with a FQDN-aware
      policy engine or an egress proxy
spec:
  podSelector:
    matchLabels:
      {{- include "acp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ .port }}
          protocol: {{ .protocol }}
        {{- end }}
    {{- /*
      THE CHART'S OWN API, WHICH THIS POLICY BLOCKED UNTIL 2026-09-08.

      The preflight hook reads `http://<release>-api:80/readyz` and carries this chart's selector
      labels, so this policy applies to it — and neither 80 nor 8077 is in `egressPorts`, which
      lists the ports ACP needs to leave the CLUSTER on. Its request was dropped, it exited 1, and
      Helm failed the release:

        Error: INSTALLATION FAILED: failed post-install: job acp-preflight failed:
               BackoffLimitExceeded
        [preflight] could not reach http://acp-api:80/readyz: <urlopen error timed out>

      SO `helm install` OF THIS CHART FAILED ON ANY CLUSTER THAT ENFORCES NETWORKPOLICY — which is
      every production cluster and was not the reference cluster until Calico replaced kindnet.
      kindnet accepts policies and enforces none, so eleven green runs said nothing about this.

      Scoped to the API pods rather than opening a port globally: `to` plus `ports` is an AND, so
      this permits ACP's pods to reach ACP's API and nothing else. BOTH ports are named because a
      ClusterIP connection is DNATed to the backend before it leaves, and which of the two a given
      CNI matches on is an implementation detail this chart should not depend on.
    */}}
    - to:
        - podSelector:
            matchLabels:
              {{- include "acp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
        - port: {{ .Values.api.service.port }}
          protocol: TCP
{{- end }}
{{- end }}
