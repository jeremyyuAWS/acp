{{/*
Where the connection details come from — one Secret name, three possible producers.

THIS CHART NEVER CONTAINS A SECRET VALUE. Not as a default, not as an example, not base64'd into
values.yaml. A chart that can hold a credential is a chart whose values file becomes a secret
store, and values files get committed, pasted into tickets and attached to support bundles.

What the chart holds is a REFERENCE. The deployment document names a vault entry
(`secrets.refs.database-url: {name: acp-kv, key: database-url}`) and one of these paths resolves
it:

  existingSecret     the operator manages the Secret themselves; this chart only mounts it
  externalSecrets    the External Secrets Operator syncs the platform vault into a Secret
  kubernetes         the reference names a Secret that already exists in the namespace

The last case is the one that needs stating: with `provider: kubernetes` there is nothing to
sync, so the chart does NOT create a Secret — it expects the named one to be there, and the
workloads' secretKeyRef fails loudly at pod start if it is not. Creating an empty Secret so the
mount succeeds would be worse: the pods would start with empty credentials and fail later,
somewhere less obviously about configuration.
*/}}
{{- if and .Values.secrets.externalSecrets.enabled (not .Values.secrets.existingSecret) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "acp.fullname" . }}-secrets
  labels:
    {{- include "acp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef | default (printf "%s-store" (include "acp.fullname" .)) }}
    kind: SecretStore
  target:
    name: {{ include "acp.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $key, $ref := .Values.secrets.refs }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $ref.name }}
        property: {{ $ref.key }}
    {{- end }}
{{- end }}
