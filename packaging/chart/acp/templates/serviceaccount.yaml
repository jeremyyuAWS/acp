{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "acp.serviceAccountName" . }}
  labels:
    {{- include "acp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  {{- /*
    Where workload identity is bound: an AKS, EKS or GKE adapter puts its annotation here, and
    this is the ONE place the platform reaches into the workloads. Keeping it to an annotation on
    the ServiceAccount is what lets the Deployments themselves stay byte-identical across clouds
    — the property templates/../tests check rather than assume.
  */}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
