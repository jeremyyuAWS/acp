# Netlify build config for the mova.io accessibility-compliance demo.
#
# The app runs as a FULLY SELF-CONTAINED static SPA — it ships with a simulated
# multi-source estate (see frontend/src/sim.js, SIM flag) and makes NO backend
# calls, so there's nothing to connect, no API, and nothing to secure. Just a
# public "art of the possible" demo.
#
# Deploy: push this repo to GitHub, then in Netlify "Add new site -> Import from
# Git", pick the repo. Netlify auto-detects this file and builds the SPA. The
# resulting URL is public by design (no passcode).
#
# (To run against the real backend instead, set SIM=false in sim.js and provide
# VITE_API; not needed for the demo.)

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Optional chat LLM endpoint (no-op unless ANTHROPIC_API_KEY is set in env)
[functions]
  directory = "netlify/functions"

# Note: /.netlify/functions/* is reserved and auto-routed by Netlify BEFORE redirects,
# so no rule is needed (and a redirect with that source is rejected). The SPA catch-all
# below never swallows function calls.

# SPA fallback so refreshes / deep links resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
